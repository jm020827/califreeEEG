seed: 42
run_name: wearable_development_controls
mode: robustness
data:
  processed_dirs:
  - ${env:EEG_DATA_ROOT}/processed/wearable_v3
  expected_revisions:
    wearable: wearable_v3
  expected_dataset_counts:
    wearable:
      n_samples: 24480
      n_subjects: 102
      n_targets: 12
  require_audit_receipt: true
  split: val
trial_time_sec: 2.0
perturbations:
- name: within_class_shuffle_val_only
  type: metadata_shuffle
  seed: 42
- name: counterfactual_wet_dry_val_only
  type: metadata_counterfactual_wet_dry
  seed: 42
output_csv: outputs/development/wearable_v3/controls_eval/robustness.csv
