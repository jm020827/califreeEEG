paths:
  project_root: ${env:PROJECT_ROOT}
  data_root: ${env:EEG_DATA_ROOT}
  hf_home: ${env:HF_HOME}
  hf_hub_cache: ${env:HF_HUB_CACHE}
  mne_data: ${env:MNE_DATA}

policies:
  allow_download_during_train: false
  allow_download_during_import: false
  require_explicit_fetch: true
  local_files_only_by_default: true
  max_test_fixture_mb: 1

external_sources:
  reve_base:
    repo_id: brain-bzh/reve-base
    type: huggingface_model
    note: REVE backbone; use transformers.AutoModel.from_pretrained(..., trust_remote_code=True)
    required_sample_rate_hz: 200
    url: https://huggingface.co/brain-bzh/reve-base
  reve_positions:
    repo_id: brain-bzh/reve-positions
    type: huggingface_model
    note: position bank mapping electrode names to positions
    required_sample_rate_hz: 200
    url: https://huggingface.co/brain-bzh/reve-positions
  beta:
    figshare_article_id: 12264401
    figshare_article_version: 3
    type: figshare_or_manual
    note: 64-channel EEG, 70 subjects, 40-target SSVEP
    url: https://figshare.com/articles/dataset/The_BETA_database/12264401
  wang:
    type: zenodo_or_manual
    zenodo_record_id: 14865172
    note: Public Zenodo MOABB re-upload; 35 subjects, 64-channel EEG, 40-target SSVEP benchmark; verify upstream rights before redistribution
    url: https://zenodo.org/records/14865172
  dong2023:
    type: zenodo_or_nemar
    zenodo_record_id: 18847318
    note: Public Zenodo mirror and NEMAR distribution; 8-channel, 59-subject, 40-target acquisition-domain contrast for Wang/BETA
    url: https://www.nemar.org/dataset/nm000128
  wearable:
    type: figshare_or_manual
    dataset_revision: wearable_v3
    figshare_article_id: 13560281
    figshare_article_version: 4
    note: 8-channel wearable SSVEP, 102 subjects, 12-target, wet/dry electrodes and impedance metadata
    url: https://figshare.com/articles/dataset/An_Open_Dataset_for_Wearable_SSVEP-Based_Brain-Computer_Interfaces/13560281
  openbci_cyton:
    type: local_private_recording
    note: 8-channel Cyton board; raw sampling rate is 250 Hz per channel
    url: https://shop.openbci.com/products/cyton-biosensing-board-8-channel

models:
  reve_base:
    type: huggingface_model
    repo_id: brain-bzh/reve-base
    positions_repo_id: brain-bzh/reve-positions
    cache_dir: ${paths.hf_hub_cache}
    requires_hf_login: true
    trust_remote_code: true
    local_files_only: true
    allow_download: false
    required_sample_rate_hz: 200
    freeze: true
    no_redistribution: true
  tiny_eeg_transformer:
    type: local_code
    requires_external_asset: false

datasets:
  synthetic:
    type: generated
    raw_dir: null
    processed_dir: data/processed/synthetic
    target_sfreq: 200
    public: false
  beta:
    type: figshare_or_manual
    figshare_article_id: 12264401
    figshare_article_version: 3
    raw_dir: ${paths.data_root}/raw/beta
    processed_dir: ${paths.data_root}/processed/beta_v1
    target_sfreq: 200
    expected:
      n_samples: 11200
      n_subjects: 70
      n_channels: 64
      n_targets: 40
    fetch:
      method: figshare
      allow_manual_fallback: true
  wang:
    type: zenodo_or_manual
    zenodo_record_id: 14865172
    raw_dir: ${paths.data_root}/raw/wang
    processed_dir: ${paths.data_root}/processed/wang_v1
    target_sfreq: 200
    expected:
      n_samples: 8400
      n_subjects: 35
      n_channels: 64
      n_targets: 40
    fetch:
      method: zenodo
      allow_manual_fallback: true
  dong2023:
    type: zenodo_or_nemar
    zenodo_record_id: 18847318
    raw_dir: ${paths.data_root}/raw/dong2023
    processed_dir: ${paths.data_root}/processed/dong2023_v1
    target_sfreq: 200
    expected:
      n_samples: 9440
      n_subjects: 59
      n_channels: 8
      n_targets: 40
    fetch:
      method: zenodo
      allow_manual_fallback: true
  wearable:
    type: figshare_or_manual
    dataset_revision: wearable_v3
    figshare_article_id: 13560281
    figshare_article_version: 4
    raw_dir: ${paths.data_root}/raw/wearable
    processed_dir: ${paths.data_root}/processed/wearable_v3
    target_sfreq: 200
    required_manifest_columns:
    - query_signal_std
    - query_signal_std_by_channel
    - impedance_kohm_by_channel
    - headband_order
    - condition_period
    expected:
      n_samples: 24480
      n_subjects: 102
      n_channels: 8
      n_targets: 12
      has_wet_dry: true
      has_impedance: true
    fetch:
      method: figshare
      allow_manual_fallback: true
  openbci:
    type: local_private
    raw_dir: ${paths.data_root}/raw/openbci
    processed_dir: ${paths.data_root}/processed/openbci_v1
    target_sfreq: 200
    expected:
      n_channels: 8
      raw_sfreq: 250
    public: false
