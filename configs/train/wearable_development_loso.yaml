development_grid:
  schema: cfeg.development-loso-design.v1
  status: frozen
  grid_id: wearable-v3-s1-s3-a0-a2-fixed-epoch-v1
  roles: [A0_eeg_only, A2_structured_condition_prompt]
  seeds: [42]
  folds: [0, 1, 2]
  recommended_max_outcome_reveals: 2
  absolute_max_outcome_reveals: 3
  interpretation: descriptive_falsification_only
seed: 42
run_name: wearable_development_loso
output_dir: outputs/development-loso/unresolved
assets_config: configs/assets.yaml
protocol:
  metadata_contract_version: 0.4-dev
  governance_required: true
  execution_phase: development
  analysis_plan: configs/analysis/wearable_primary.yaml
  query_qc_extractor_version: filtered_cropped_pre_zscore_channel_std_median_v1
  external_continuous_schema: impedance_mean_max_v1
data:
  cohort_role: development
  split_seed: 42
  processed_dirs:
  - ${env:EEG_DATA_ROOT}/processed/wearable_v3
  expected_revisions:
    wearable: wearable_v3
  expected_dataset_counts:
    wearable:
      n_samples: 24480
      n_subjects: 102
      n_targets: 12
  require_audit_receipt: true
  split: development_subject_fold
  n_folds: 3
  fold_index: 0
  batch_size: 256
  eval_batch_size: 256
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  persistent_hdf5_handles: true
  preload_hdf5_to_memory: true
model:
  n_classes: 12
  c_max: 64
  target_sfreq: 200
  t_len: 400
  d_model: 256
  patch_size: 20
  depth: 3
  n_heads: 8
  backbone:
    name: spectral_transformer
    min_frequency_hz: 6.0
    max_frequency_hz: 60.0
  condition_encoder:
    enabled: true
    n_prompt_tokens: 4
    fields: [reference, electrode_type, cap_type]
    include_continuous: true
    include_channels: false
    external_metadata_mode: observed
  adapter:
    enabled: true
    type: conditioned_feature_adapter
    bottleneck_dim: 64
  latent:
    enabled: false
    z_dim: 16
train:
  epochs: 10
  checkpoint_selection: fixed_epoch_blind
  lr: 0.0003
  weight_decay: 0.01
  amp: true
  eval_amp: false
  grad_clip_norm: 1.0
  early_stop_patience: 20
checkpoint:
  save_trainable_only: true
loss:
  lambda_cons: 0.0
  lambda_logit_cons: 0.0
  beta_kl: 0.001
  ce_zero_weight: 0.5
tracking:
  wandb:
    enabled: false
    project: calibration-free-eeg
    entity: null
    mode: disabled
    tags: [wearable, development-only, s1-s3, blind-loso]
    log_model: false
    watch_model: false
evaluation:
  trial_time_sec: 2.0
  open_test: false
runtime:
  device: cuda
  probe_cuda: true
augment:
  categorical_metadata_dropout_prob: 0.0
  make_two_views: false
  channel_dropout_prob: 0.0
  min_channels: 2
  channel_sets: [wearable_native_8, occipital_4, occipital_2]
  channel_subset_prob: 0.0
  noise_std_range: [0.0, 0.0]
  time_shift_samples: 0
