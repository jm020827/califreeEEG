seed: 42
run_name: wearable_wet_to_dry
output_dir: outputs/research/wearable_wet_to_dry
assets_config: configs/assets.yaml
data:
  processed_dirs:
  - ${env:EEG_DATA_ROOT}/processed/wearable_v1
  split: cross_condition
  val_ratio: 0.2
  batch_size: 64
  num_workers: 4
  train_filter:
    dataset_id: wearable
    electrode_type: wet
  test_filter:
    dataset_id: wearable
    electrode_type: dry
model:
  n_classes: 12
  c_max: 64
  target_sfreq: 200
  t_len: 400
  d_model: 256
  patch_size: 20
  depth: 6
  n_heads: 8
  backbone:
    name: tiny_transformer
  condition_encoder:
    enabled: true
    n_prompt_tokens: 4
    include_continuous: true
    include_channels: true
  adapter:
    enabled: true
    type: conditioned_feature_adapter
    bottleneck_dim: 64
  latent:
    enabled: true
    z_dim: 16
train:
  epochs: 100
  lr: 0.0003
  weight_decay: 0.01
  amp: true
  grad_clip_norm: 1.0
  early_stop_patience: 15
checkpoint:
  save_trainable_only: true
loss:
  lambda_cons: 0.1
  lambda_logit_cons: 0.05
  beta_kl: 0.001
  ce_zero_weight: 0.5
tracking:
  wandb:
    enabled: false
    project: calibration-free-eeg
    entity: null
    mode: online
    tags:
    - wearable
    - wet-dry-transfer
    log_model: false
    watch_model: false
evaluation:
  trial_time_sec: 2.0
augment:
  make_two_views: true
  channel_dropout_prob: 0.2
  min_channels: 2
  channel_sets: [occipital_8, occipital_4, occipital_2]
  channel_subset_prob: 0.75
  noise_std_range: [0.01, 0.05]
  time_shift_samples: 8
