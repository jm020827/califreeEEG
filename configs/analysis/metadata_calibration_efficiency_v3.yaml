schema: cfeg.metadata-calibration-efficiency-plan.v3
candidate_id: metadata-calibration-efficiency-v3
decision_id: DEC-20260906-024
status: V3_1_preoutcome_recovery_development_v2_not_yet_bundle_frozen
contract_stage: development_selection_only
scientific_candidate_id: null
scientific_candidate_id_template: metadata-calibration-efficiency-v3-p3-nu_{nu_token}-lambda_{lambda_token}

preoutcome_amendment:
  path: configs/governance/metadata_calibration_v3_1_recovery_amendment.json
  file_sha256: deddca9286f07c6293925409d01b3df1313e89f2ce89688c4a25c14a8ec01238
  protocol_revision: V3.1
  development_attempt_id: development-v2
  original_path: configs/governance/metadata_calibration_v3_preoutcome_amendment.json
  original_file_sha256: 3238761a0a9a257032d6582286953a4d20981e5e646c9f1322c5c0357bd0c202
  v2_is_retired_ancestor_not_execution_parent: true
  development_v1_is_infrastructure_retired_not_scientifically_adjudicated: true
  scientific_contract_projection_sha256: 0702d01be1e055d3203a3c1b78777db6456b8d527e5525b6d468fb52522f8a79

objective: >-
  Test whether pre-query acquisition context reduces labeled target-user
  calibration burden for unseen-participant closed-set SSVEP beyond an
  otherwise identical EEG-derived-Q support path, while preserving a strict
  FBCCA no-calibration anchor and exact metadata-off fallback.

research_question: >-
  At the same participant, query, labeled complete-block support, and common
  signal-only estimator, does knowing query-support electrode interface and
  pre-query channel impedance improve the k=0/1/3 early calibration curve?

claim_order:
  - id: Q_support_increment
    contrast: participant_eAUC_A_Q_minus_A0
    meaning: labeled calibration EEG itself has value beyond strict FBCCA
  - id: M_increment
    contrast: participant_eAUC_A_QM_minus_A_Q
    meaning: external acquisition context adds value beyond EEG-derived Q
  - id: pairing_mechanism
    contrasts:
      - k3_A_QM_correct_minus_within_prefix_pair_shuffle
    meaning: at_k3_any_gain_depends_on_the_correct_query_support_block_context_relation
  - id: Q_calibration_value
    contrast: participant_A_Q_k3_minus_A_Q_k1
    meaning: three calibration blocks improve on one block so there is burden to save
  - id: calibration_saving
    contrast: A_QM_k1_noninferior_to_A_Q_k3
    opens_only_after: [Q_support_increment, M_increment, pairing_mechanism, Q_calibration_value]

interpretation_boundary:
  allowed:
    - same_study_unseen_participant_predictive_utility
    - population_average_reduction_in_labeled_complete_block_burden
    - exact_software_fallback_when_metadata_is_disabled_or_all_missing
  forbidden:
    - first_few_shot_or_one_shot_SSVEP_claim
    - causal_effect_of_impedance_or_electrode_interface
    - broad_device_site_or_open_set_OOD_claim
    - k1_individual_no_harm_guarantee
    - synthetic_efficacy_as_human_EEG_evidence
    - equating_LLM_pass_at_K_with_EEG_calibration_k

information_rights:
  common_allowed:
    - current_query_EEG
    - frozen_complete_candidate_frequency_codebook_applied_identically_to_every_query
    - labeled_target_support_EEG_from_exact_complete_blocks
    - support_labels
    - signal_derived_query_and_support_Q
  metadata_adapter_only:
    - pre_query_electrode_interface
    - pre_query_block_channel_impedance_kohm
    - explicit_missing_unknown_and_measurement_validity_flags
    - source_frozen_context_reference_receipt
  scientific_operator_allowed:
    - anchor_probability
    - M_free_support_probability
    - M_free_support_reliability
    - lambda_Q
    - typed_ContextTrustCapability_with_g_M_and_receipt_hashes
  forbidden:
    - target_query_labels_or_outcomes_during_fit_selection_or_gating
    - query_batch_transduction
    - correct_class_frequency_as_a_row_specific_feature
    - participant_file_row_or_dataset_identity_as_a_model_feature
    - post_query_metadata
    - v1_or_v2_outcomes_as_independent_v3_evidence
    - raw_interface_or_impedance_at_the_scientific_operator_boundary

roles:
  A0:
    name: repeated_strict_FBCCA
    labeled_support: false
    signal_Q: false
    acquisition_M: false
  A_Q:
    name: bounded_score_prototype_support_residual
    labeled_support: true
    signal_Q: true
    acquisition_M: false
  A_QM:
    name: single_insertion_context_trust_support_residual
    labeled_support: true
    signal_Q: true
    acquisition_M: typed_adapter_capability_only

anchor:
  implementation: src/cfeg/baselines/fbcca.py::predict_fbcca
  filterbank_config: configs/baselines/fbcca_chen2015_m3_v2_explicit_weights.yaml
  filterbank_config_sha256: b8c1ce4477d980b40f359bc3dc97f3125313191d24401f29a7e2dc473d0d1380
  score_schema: strict_fbcca_bound_filterbank_raw_scores_v1
  codebook_rule: every_candidate_frequency_and_phase_in_the_same_frozen_order_for_every_query
  direct_return_without_arithmetic_when_support_is_disabled: true

score_normalization:
  formula: overflow_safe_row_scale_center_root_mean_square
  epsilon: 1.0e-12
  base_probability: softmax_temperature_one
  base_prediction: raw_FBCCA_argmax
  Jensen_Shannon_divergence: half_KL_p_to_midpoint_plus_half_KL_q_to_midpoint_with_natural_log_and_1e_minus_12_clamp

support_residual:
  operator_id: P3_blockwise_score_prototype_reliability_mixture
  M_may_enter_prototype: false
  ideal_prototype_smoothing: 0.05
  ideal_prototype_formula: smoothing_divided_by_C_plus_one_minus_smoothing_on_true_class
  per_block_class_prototype_formula: >-
    For each complete block b and class c, r_bc equals
    (prior times ideal_c plus that block's one support probability with
    observed label c) divided by (prior plus one).
  query_class_score: negative_Jensen_Shannon_between_query_probability_and_class_prototype
  per_block_support_probability: softmax_over_query_class_scores_from_r_bc
  block_reliability: >-
    w_b equals clip to [1e-12,1] of the arithmetic mean over the complete
    block's C trials of immutable strict-FBCCA temperature-one probability on
    each observed support label.
  normalized_block_weight: pi_b_equals_w_b_divided_by_sum_over_available_blocks_w_b
  support_probability: p_support_q_equals_sum_over_available_blocks_pi_b_times_p_support_qb
  A_Q_and_A_QM_support_probability_and_weights_must_be_bitwise_identical: true
  uniform_block_weight_sensitivity_required: true
  development_grid:
    prototype_prior_pseudocount: [1.0, 4.0, 16.0]
    lambda_max: [0.10, 0.20, 0.30]
    canonical_cells:
      - {index: 1, id: p3-nu_1-lambda_0p10, nu_token: '1', lambda_token: 0p10, prototype_prior_pseudocount: 1.0, lambda_max: 0.10, operator_instance_sha256: 63ad5a68d79dbad9cfe4443a207eefd96a15d643bf6bbb4914c7a487bb59e5f9}
      - {index: 2, id: p3-nu_1-lambda_0p20, nu_token: '1', lambda_token: 0p20, prototype_prior_pseudocount: 1.0, lambda_max: 0.20, operator_instance_sha256: 60b4fdb0f0039ac4e0a08c2ebb7e11e36e0aa43b0578362ada8e0bed81e8a43f}
      - {index: 3, id: p3-nu_1-lambda_0p30, nu_token: '1', lambda_token: 0p30, prototype_prior_pseudocount: 1.0, lambda_max: 0.30, operator_instance_sha256: 16c9d0b71e855df9190bc961b78b0fdc1fd9123628ace1d856ddd7b0faad2786}
      - {index: 4, id: p3-nu_4-lambda_0p10, nu_token: '4', lambda_token: 0p10, prototype_prior_pseudocount: 4.0, lambda_max: 0.10, operator_instance_sha256: 38c8ffbcc9746bfcfb0a8157012111412f1eecb9c9ed590135763fd548c29613}
      - {index: 5, id: p3-nu_4-lambda_0p20, nu_token: '4', lambda_token: 0p20, prototype_prior_pseudocount: 4.0, lambda_max: 0.20, operator_instance_sha256: 5723702a4df184cc70dc6195a8031904eb57d0300e555dbf8cfa6345dc9b8347}
      - {index: 6, id: p3-nu_4-lambda_0p30, nu_token: '4', lambda_token: 0p30, prototype_prior_pseudocount: 4.0, lambda_max: 0.30, operator_instance_sha256: 73668e3f34272a69d8a0ba7265acb3b53b40aeb0c4ea5889bc910d7d878d3558}
      - {index: 7, id: p3-nu_16-lambda_0p10, nu_token: '16', lambda_token: 0p10, prototype_prior_pseudocount: 16.0, lambda_max: 0.10, operator_instance_sha256: a0a46034f0d857410c9a70661cce5c73e25a31bd7b51515d0b8adf8ebd2c3201}
      - {index: 8, id: p3-nu_16-lambda_0p20, nu_token: '16', lambda_token: 0p20, prototype_prior_pseudocount: 16.0, lambda_max: 0.20, operator_instance_sha256: 035c524182fc1c4fca0ae5ccb273d09b4499955784e89b948861312511620d08}
      - {index: 9, id: p3-nu_16-lambda_0p30, nu_token: '16', lambda_token: 0p30, prototype_prior_pseudocount: 16.0, lambda_max: 0.30, operator_instance_sha256: d0db62d57756ea1513b910d6c7e2b85b82d0a0b8aa1b76a4a7f9a03ea32e3bfa}
    token_encoding_is_exact_ASCII: true
    exact_operator_instance_digest: >-
      SHA256 of UTF-8 JSON serialized with sorted keys, compact separators,
      ensure_ascii=true and allow_nan=false over a string-valued object binding
      schema cfeg.metadata-calibration-efficiency-v3.operator-instance.v1,
      candidate_id, canonical grid cell ID, nu_token, lambda_token, operator_id,
      filterbank SHA-256, score-normalization ID, common-P3 weighting ID,
      fusion ID, and context-trust ID.
    exact_digest_payload_constant_values:
      schema: cfeg.metadata-calibration-efficiency-v3.operator-instance.v1
      candidate_id: metadata-calibration-efficiency-v3
      operator_id: P3_blockwise_score_prototype_reliability_mixture
      filterbank_sha256: b8c1ce4477d980b40f359bc3dc97f3125313191d24401f29a7e2dc473d0d1380
      score_normalization_id: overflow_safe_row_RMS_softmax_T1_v1
      support_weighting_id: strict_FBCCA_observed_label_relative_block_mixture_v1
      fusion_id: bounded_entropy_budget_support_residual_v1
      context_trust_id: interface_scaled_impedance_affinity_single_insertion_v1
    exact_digest_payload_variable_mapping:
      grid_cell_id: canonical_cells_item_id_exact_ASCII
      nu_token: canonical_cells_item_nu_token_exact_ASCII
      lambda_token: canonical_cells_item_lambda_token_exact_ASCII
    exact_digest_payload_key_set:
      - schema
      - candidate_id
      - operator_id
      - filterbank_sha256
      - score_normalization_id
      - support_weighting_id
      - fusion_id
      - context_trust_id
      - grid_cell_id
      - nu_token
      - lambda_token
    numeric_float_fields_enter_digest_payload: false
    missing_duplicate_or_extra_digest_payload_key: reject
  selection_tie_order:
    - satisfy_all_synthetic_development_requirements
    - maximize_exact_minimum_mandatory_observed_gain_tuple_component
    - maximize_exact_minimum_corresponding_one_sided_LCB_tuple_component
    - minimize_lambda_max
    - maximize_prototype_prior_pseudocount
    - ascending_canonical_grid_cell_index_from_the_explicit_nine_cell_table
  exact_rank_tuple_definition: >-
    First component is min(max(B1_AQ_minus_A0_mean,B2_AQ_minus_A0_mean),
    B3_AQM_minus_AQ_mean,B4_AQM_minus_AQ_mean,
    B3_k3_mechanism_mean,B4_k3_mechanism_mean).
    Second uses the corresponding one-sided LCBs in the same expression.
    Both are maximized without rounding before smaller lambda, larger
    pseudocount, and ascending explicit canonical cell index break remaining ties.
  selected_parameters: null
  selected_parameters_must_be_frozen_before_any_scientific_lockbox: true

fusion:
  query_quality: normalized_entropy_of_anchor_probability
  budget_factor: k_divided_by_k_plus_one
  A_Q_lambda: lambda_max_times_budget_factor_times_query_quality
  A_Q_probability: one_minus_lambda_Q_times_anchor_plus_lambda_Q_times_support
  probability_displacement_l1_upper_bound: two_times_lambda_Q
  direct_return_without_arithmetic_when_disabled: true

metadata_trust:
  scientific_role: detect_when_a_labeled_support_block_is_not_transferable_to_the_current_query
  metadata_adapter:
    preflight_stage:
      accepted_raw_fields: [interface_lookup_key, impedance_kohm_by_channel, channel_availability, query_and_ordered_support_packet_keys, pairing_sha256]
      forbidden_inputs: [raw_EEG, support_labels, query_labels, class_scores, probabilities, MFreeSupportReliabilityCapability]
      runs_before_any_support_EEG_or_label_access: true
      output_type: ContextPreflightCapability
      output_fields: [candidate_id, query_key, ordered_support_block_keys, affinity_by_support_block, comparable_channel_counts, decision_reason, context_reference_receipt_sha256, pairing_sha256, payload_sha256]
      malformed_or_query_OOD_decision: exact_A0_without_support_access
    finalization_stage:
      accepted_typed_inputs: [ContextPreflightCapability, MFreeSupportReliabilityCapability]
      forbidden_direct_inputs: [raw_EEG, support_labels, query_labels, class_scores, probabilities, raw_interface, raw_impedance]
      runs_only_after_nonrejecting_preflight: true
    output_type: ContextTrustCapability
    output_fields:
      - candidate_id
      - active_grid_cell_id
      - exact_operator_instance_digest
      - query_key
      - ordered_support_block_keys
      - g_M_by_query
      - comparable_block_count_by_query
      - decision_reason
      - context_reference_receipt_sha256
      - context_preflight_capability_sha256
      - support_reliability_capability_sha256
      - pairing_sha256
    may_emit_class_scores_logits_or_probabilities: false
  scientific_operator_boundary:
    accepted_context_type: ContextTrustCapability_only
    forbidden_raw_inputs: [electrode_interface, interface_lookup_key, impedance_kohm_by_channel, channel_availability]
    p_support_must_be_bitwise_identical_between_A_Q_and_A_QM: true
    must_match_current_signal_state: [candidate_id, active_grid_cell_id, exact_operator_instance_digest, query_key, ordered_support_block_keys, context_preflight_capability_sha256, support_reliability_capability_sha256]
  single_insertion_point: final_support_residual_coefficient_only
  A_QM_lambda: lambda_Q_times_g_M
  A_QM_probability: one_minus_open_lambda_Q_times_g_M_close_times_anchor_plus_open_lambda_Q_times_g_M_close_times_support
  prohibited_second_insertion_points:
    - class_prototype_weight
    - score_or_logit_offset
    - query_precision
    - decoder_wide_FiLM_or_prompt
    - waveform_or_channel_transform
  g_M_range: [0.0, 1.0]
  context_distance_field: standardized_impedance_only
  primary_support_and_query_interface_relation: same_interface_by_contract
  absolute_interface_may_directly_change_logits: false
  interface_role: select_a_source_covariate_only_frozen_impedance_scale
  context_reference_estimator:
    inputs: [electrode_interface, impedance_kohm_by_channel, channel_availability]
    forbidden_inputs: [EEG, support_labels, query_labels, predictions, performance]
    center: per_interface_per_channel_median_of_log1p_impedance
    robust_scale: per_interface_per_channel_1p4826_times_MAD_of_log1p_impedance
    pooled_center: per_channel_median_over_all_available_raw_log1p_impedance_values_from_all_interfaces
    pooled_robust_scale: per_channel_1p4826_times_MAD_about_the_pooled_center_over_the_same_raw_values
    scale_floor: 0.05
    minimum_per_interface_channel_count: 128
    pooled_per_channel_fallback_minimum_count: 256
    lookup_fallback_order: [interface_channel_center_and_scale_pair, pooled_channel_center_and_scale_pair, channel_unavailable]
    unknown_interface_OOD_standardization: pooled_channel_center_and_scale_pair
    held_metadata_recentring_or_rescaling: forbidden
    receipt_required: true
    reference_receipts_are_domain_scoped_and_noninterchangeable: true
    domain_references:
      synthetic_development_and_future_synthetic:
        source: separately_keyed_covariate_only_generator_in_synthetic_plan
        root_seed: 20260910
        shares_no_participant_or_outcome_key_with_evaluation: true
        human_metadata_access: false
      future_wearable_human:
        source: exact_exposed_v1_source39_metadata_only_never_held_metadata
        current_authority: false
        requires_separate_explicit_human_metadata_input_authority: true
        allocation_sha256: 0c5b7cd1ca8eedafbe9290833a283160f7bfe89897be8923b21568f70bb18898
        subject_ids: [sub004, sub006, sub008, sub011, sub014, sub021, sub022, sub025, sub028, sub029, sub030, sub031, sub032, sub033, sub037, sub041, sub042, sub043, sub044, sub046, sub054, sub055, sub056, sub061, sub063, sub065, sub067, sub073, sub074, sub077, sub080, sub082, sub083, sub084, sub089, sub092, sub097, sub100, sub102]
        source_development_evaluation: fit_reference_foldwise_without_validation_participant_metadata
        held_evaluation: fit_once_on_the_frozen_allowed_source_metadata_only
  per_query_support_block_distance: >-
    d_qb equals the median over canonical channels observed in both packets of
    abs((log1p(Z_qc)-center_Ic)/scale_Ic -
    (log1p(Z_bc)-center_Ic)/scale_Ic).
  per_query_support_block_affinity: >-
    If at least one channel is comparable, a_qb equals two to the power
    negative clip(d_qb,0,16); if none is comparable, a_qb is exactly one so
    missing context is neutral rather than evidence of mismatch.
  M_free_support_block_reliability: >-
    Reuse the immutable strict-FBCCA block reliability w_b and normalized
    relative weight pi_b defined in support_residual.
    This value uses the already-authorized support labels but no fitted P3,
    M, query EEG, query label, query batch, or row identity.
  M_free_support_block_reliability_type: >-
    MFreeSupportReliabilityCapability binds candidate ID, active grid cell and
    exact operator-instance digest,
    anchor-normalizer digests, ordered support-block keys, w_b values, support
    EEG-plus-label manifest digest, and its own canonical payload SHA-256. The
    metadata adapter receives only this typed capability, never raw EEG,
    labels, class scores, or probabilities.
  multi_support_aggregation: >-
    Over every available support block, g_M_q=sum_b w_b*a_qb divided by
    sum_b w_b, with a_qb exactly one for a block lacking comparable context.
    Context packet b remains paired to the M-free reliability from support EEG block b, so a
    nonidentity packet shuffle can change g_M without changing the packet multiset.
  standardized_distance_clip: [0.0, 16.0]
  exact_neutral: all_valid_d_qb_exact_zero_or_computed_g_M_exact_one_direct_returns_A_Q
  context_OOD_guard: >-
    For the current query packet only, if more than half of its valid channels
    have abs((log1p(Z_qc)-center_Ic)/scale_Ic)>8, return A0 before support access.
  cross_interface_support_in_primary: forbidden
  partial_missing_channels: compute_only_over_channels_observed_in_both_packets_and_use_exact_neutral_affinity_if_none
  interface_without_impedance: no_effect_and_bitwise_exact_A_Q
  all_missing: bitwise_exact_A_Q_direct_return
  unknown_interface: use_pooled_channel_center_and_scale_pair_then_exact_A_Q_if_no_valid_channel
  malformed_packet_or_pairing_digest: reject_before_support_access_and_return_A0
  invalid_impedance: treat_nonfinite_or_negative_channel_as_unavailable_and_return_A_Q_if_none_remain
  k0: bitwise_exact_A0_without_context_or_support_access
  pairing_receipt: exact_query_and_support_packet_keys_and_sha256_required
  claim_boundary: >-
    g_M is a fixed bounded operational trust rule, not a causal impedance model
    and not an unseen-person no-harm certificate.

target_local_gate:
  k0: exact_A0
  gate_is_fit_and_evaluated_on: A_Q_vs_A0_only_without_any_M
  gate_decision_is_bitwise_shared_by_A_Q_and_A_QM: true
  metadata_may_not_change_the_gate_decision: true
  k1: globally_enabled_by_this_development_contract_plus_observable_context_validity_guard_only
  k1_global_enable_value: true
  k3:
    chronological_folds:
      - {evaluation_block: 2, fit_blocks: [1]}
      - {evaluation_block: 3, fit_blocks: [1, 2]}
  k5_descriptive:
    chronological_folds:
      - {evaluation_block: 2, fit_blocks: [1]}
      - {evaluation_block: 3, fit_blocks: [1, 2]}
      - {evaluation_block: 4, fit_blocks: [1, 2, 3]}
      - {evaluation_block: 5, fit_blocks: [1, 2, 3, 4]}
  enable_rule:
    - every_prequential_balanced_accuracy_delta_ge_0
    - every_prequential_correct_log_probability_delta_gt_0
    - at_least_one_prequential_balanced_accuracy_delta_gt_0
  otherwise: exact_A0_for_both_A_Q_and_A_QM
  prequential_reliability_rule: >-
    When predicting an evaluation calibration block, w_b and p_support are
    computed only from earlier fit-prefix blocks; the evaluation block label
    never contributes to its own prediction. Final immutable query prediction
    may use all currently authorized support blocks.
  final_query_labels_available_to_gate: false
  claim_boundary: empirical_operational_fallback_not_finite_sample_safety_guarantee

calibration_contract:
  unit: one_complete_labeled_block_per_participant_per_interface
  classes_per_wearable_block: 12
  primary_budgets: [0, 1, 3]
  descriptive_budget: 5
  labeled_trials_per_interface: {0: 0, 1: 12, 3: 36, 5: 60}
  nested_support:
    0: []
    1: [block01]
    3: [block01, block02, block03]
    5: [block01, block02, block03, block04, block05]
  immutable_wearable_query: [block06, block07, block08, block09, block10]
  support_query_disjoint: true
  classwise_mixed_block_sampling: forbidden

factor_ablation:
  primary: interface_calibrated_impedance_distance
  required_supportive:
    - all_missing_exact_A_Q
    - impedance_with_pooled_not_interface_specific_scale
    - interface_only_structural_exact_A_Q
    - wrong_interface_scale
    - k1_support_impedance_channel_rotation_structural_diagnostic_only
    - k3_within_available_prefix_pair_shuffle
  interface_only_expected_efficacy: false
  pooled_and_interface_specific_tables_fit_separately_from_the_same_source_covariates: true
  k1_pair_shuffle_is_not_a_mechanism_endpoint: true
  k1_channel_rotation_is_not_a_positive_pairing_or_efficacy_endpoint: true
  k1_channel_rotation_only_mandatory_role: N4_null_equivalence_structural_safety_guard
  reason: one_support_block_has_no_observed_prefix_peer_for_a_valid_block_pairing_control
  k3_and_k5_shuffle_reduction: exhaustive_derangement_metric_mean_within_participant
  exact_derangement_counts: {3: 2, 5: 44}
  derangements_are_never_independent_inference_units: true

development_contract_bundle:
  current_status: not_created
  protocol_revision: V3.1
  development_attempt_id: development-v2
  required_schema: cfeg.metadata-calibration-efficiency-v3.development-bundle.v2
  planned_path: /home/whwovy/v3-artifacts/metadata-calibration-efficiency-v3/development-v2/development-bundle.json
  storage: external_write_once_receipt_not_part_of_the_bound_git_tree
  must_bind:
    - master_plan_file_sha256
    - synthetic_plan_file_sha256
    - preoutcome_amendment_file_sha256
    - clean_git_commit_and_tree
    - source_bundle_sha256
    - artifact_schema_inventory_sha256
    - owner_authority_public_key_file_sha256_and_fingerprint
