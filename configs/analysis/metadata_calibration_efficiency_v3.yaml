  source_identity_rule: bundle_binds_the_already_clean_commit_and_tree_and_is_never_a_source_cleanliness_exception
  nonreserved_development_before_valid_bundle: forbidden

selected_method_transition:
  input: complete_hash_bound_nonreserved_3_by_3_grid_result
  deterministic_selector: exact_rank_tuple_in_support_residual_section
  output_schema: cfeg.metadata-calibration-efficiency-v3.selected-method-freeze.v1
  canonical_path_template: configs/governance/metadata_calibration_v3_selected_method_freeze.json
  output_must_bind:
    - development_bundle_schema
    - development_bundle_payload_sha256
    - development_bundle_file_sha256
    - development_result_schema
    - development_result_payload_sha256
    - development_result_file_sha256
    - selected_grid_cell_and_exact_parameters
    - complete_grid_and_gate_report_embedded_in_development_result_payload_sha256
    - derived_scientific_candidate_id
  anticipated_deterministic_fill_is_not_V4: true
  requires_V4:
    - operator_equation_change
    - DGP_or_threshold_change
    - grid_or_rank_rule_change
    - evidence_or_cohort_change
  after_selection: regenerate_full_test_evidence_and_canary_on_the_selected_clean_freeze

development_sequence:
  - phase: retired_development_v1_inventory_validation
    exact_file_count: 2
    continuation_authorized: false
    scientific_adjudication: none
  - phase: unit_and_invariant
    outcome_scope: generated_fixtures_only
  - phase: development_bundle_freeze
    current_status: not_created
  - phase: nonreserved_synthetic_development
    current_authority: false_until_valid_development_bundle
    purpose: select_one_exact_parameter_pair_or_stop
  - phase: selected_method_freeze
    current_status: absent_until_development_PASS
  - phase: governance_canary
    current_authority: false_until_selected_method_and_state_engine_are_frozen
    purpose: exercise_the_production_state_engine_with_public_historical_beacon_and_non_EEG_hash_probe
  - phase: synthetic_scientific_lockbox
    current_authority: false
    prerequisite: new_clean_freeze_authorization_and_unseen_future_beacon
  - phase: signal_only_external_A_Q_replication
    current_authority: false
    data: [BETA, Dong2023, Choi2019]
  - phase: metadata_bearing_human_evaluation
    current_authority: false
    data_priority: [independent_Liu2022_if_authorized, prospective_randomized_crossover, unopened_wearable60_last]

data_roles:
  v1_source39:
    status: exposed
    allowed: engineering_only_after_a_separate_explicit_human_input_authority
    independent_promotion: false
  beta_and_dong:
    role: signal_only_A_Q_validation
    can_test_M_beyond_Q: false
  choi2019:
    role: signal_only_cross_session_A_Q_replication
    can_test_M_beyond_Q: false
  liu2022_request_candidate:
    role: preferred_independent_wet_dry_impedance_replication_if_rights_and_nonoverlap_confirmed
    current_access: not_obtained
  prospective_randomized_crossover:
    role: direct_interface_and_dynamic_impedance_replication
    prerequisites: [IRB_or_equivalent_ethics, consent, governance, preregistration]
  wearable60:
    status: unopened
    role: one_time_same_study_unseen_participant_evaluation_only_after_all_prior_gates

estimands:
  eAUC:
    budgets: [0, 1, 3]
    formula: Y0_div_6_plus_Y1_div_2_plus_Y3_div_3
    participant_is_independent_unit: true
  primary_M:
    contrast: participant_eAUC_A_QM_minus_A_Q
    dry_and_wet_aggregation: equal_mean_within_participant_before_inference
    alternative: greater_than_zero
    inference: one_sided_participant_paired_t_alpha_0p05_with_sign_flip_and_bootstrap_sensitivity
    observed_mean_screen: 0.020
  Q_support_increment:
    contrast: participant_eAUC_A_Q_minus_A0
    role: prerequisite_that_labeled_support_is_useful
    lower_bound_gt: 0.0
    observed_mean_screen: 0.020
  Q_calibration_value:
    contrast: participant_A_Q_k3_minus_A_Q_k1
    lower_bound_gt: 0.0
    observed_mean_screen: 0.020
  calibration_saving:
    contrast: participant_A_QM_k1_minus_A_Q_k3
    noninferiority_margin: -0.016666666666666666
    both_balanced_accuracy_floor: 0.50
  mechanism:
    k3_observed_mean_screen: 0.010
    k1_pairing_claim: forbidden_because_one_support_block_has_no_prefix_peer
    multiplicity: Holm_alpha_0p05_after_primary_core
  conditionwise_reporting:
    required: true
    fields: [dry_contrast, wet_contrast, participant_transition, harm_tail]
    status: descriptive_unless_a_separate_multiplicity_controlled_claim_is_pre_registered
  burden_supportive:
    - labeled_trial_count
    - elapsed_calibration_time
    - impedance_measurement_and_setup_time
    - failed_or_repeated_measurements

promotion_logic:
  type: intersection_not_two_of_three
  requires:
    - invariant_suite_pass
    - A_Q_viability_B1_or_B2_pass
    - B3_impedance_metadata_efficacy_pass
    - B4_interface_calibrated_impedance_efficacy_pass
    - B4_in_reference_subset_efficacy_pass_so_OOD_fallback_cannot_create_the_only_gain
    - B4_correct_scale_beats_pooled_and_wrong_scale_diagnostics
    - k3_correct_vs_shuffle_mechanism_pass
    - B3_and_B4_A_QM_vs_A0_deployment_viability_pass
    - context_null_equivalence_pass
    - harm_and_abstention_pass
    - helpful_use_rate_anti_triviality_pass
  any_failure: retire_exact_v3_candidate_without_scientific_or_human_outcome_progression

