schema: cfeg.metadata-calibration-v2-synthetic-plan.v1
candidate_id: metadata-calibration-efficiency-v2
generator_revision: v8_pre_outcome_future_beacon_and_integrity_contract
status: frozen_before_any_synthetic_outcome
pre_outcome_amendments:
  - revision: v2_explicit_B3_state_mapping
    reason: >-
      Before either reserved seed was executed, bind the previously implicit
      mapping from the two block states to waveform regimes and bind N4's
      independent state draw. Population, contrasts, thresholds, seeds, and
      stopping rules are unchanged.
  - revision: v3_explicit_filterbank_weights
    reason: >-
      Before either reserved seed was executed, bind the seven diagnostic
      strict-FBCCA weights explicitly. NumPy 1.26 and 2.2 round the former
      power expression differently by one ULP; explicit values retain the
      already frozen operator vector across environments. Population,
      contrasts, thresholds, seeds, and stopping rules are unchanged.
  - revision: v4_explicit_generator_axes
    reason: >-
      Before either reserved seed was executed, bind every previously implicit
      random-variable axis. Channel gain and impedance are acquisition-block
      packets shared by all class trials in that block; harmonic phase follows
      h times the class phase plus block drift; and a cross-frequency component
      shares the intended class spatial signature. The implementation draft's
      class-specific impedance noise was corrected to match the pre-block
      acquisition-context semantics. Population, contrasts, thresholds,
      seeds, and stopping rules are unchanged.
  - revision: v5_exact_component_phase_formulas
    reason: >-
      Before either reserved seed was executed, add parentheses to the exact
      target and cross-frequency harmonic phase formulas. This removes a
      linguistic ambiguity without changing the implementation draft or any
      population, contrast, threshold, seed, or stopping rule.
  - revision: v6_prefix_local_context_controls
    reason: >-
      Before either reserved seed was executed, prohibit shuffled or stale
      support-context controls from sourcing metadata outside the currently
      available fit/support prefix. The implementation draft could select an
      evaluation, query, or future block packet. Prefix-local permutation and
      circular shift preserve the observed support-packet multiset; both are
      exact no-ops at depth one. Contrasts, thresholds, seeds, and stopping
      rules are unchanged.
  - revision: v7_reserved_seed_and_global_claim_guards
    reason: >-
      Before either reserved seed was executed, close direct primitive paths
      that could generate reserved-seed participants without the governed
      phase entry point, and bind the lockbox seed to one canonical claim path
      independent of the requested result path. This is an execution-
      governance correction; generator equations, populations, contrasts,
      thresholds, seeds, and stopping rules are unchanged.
  - revision: v8_future_beacon_and_integrity_contract
    reason: >-
      Before either reserved seed was executed, an independent audit established
      that a plaintext deterministic lockbox seed is only an honor-system holdout.
      Replace that unexecuted seed by a deterministic derivation from the exact
      future NIST Randomness Beacon pulse committed below. Also bind the complete
      development-result grid, the exact severe-harm safety set, repository-wide
      clean HEAD and numerical environment, full-suite test evidence, post-claim
      terminal-error semantics, and the already implemented waveform composition.
      The development seed, DGP behavior, populations, effect thresholds, and
      scientific stopping rules are unchanged; the lockbox seed is deliberately
      changed before it exists or can be inspected.
purpose: >-
  Mechanism, leakage, abstention, and implementation validation only. Synthetic
  outcomes cannot establish human EEG efficacy or acquisition-context validity.

information_boundary:
  query_labels_available_to_operator: false
  participant_sample_file_and_row_ids_available_to_operator: false
  a0_scores_must_come_from_frozen_strict_fbcca: true
  analytic_scores_derived_from_labels: forbidden
  context_control_metadata_outside_current_support_prefix: forbidden
  reserved_seed_access_through_public_rng_or_participant_primitive: forbidden
  development_outputs_may_be_inspected: true
  plaintext_lockbox_seed_committed_before_source_freeze: false
  lockbox_seed_source: exact_future_public_randomness_beacon_pulse
  lockbox_outputs_may_be_revealed_once_after_source_freeze_and_authorization: true

rng:
  bit_generator: numpy.random.PCG64DXSM
  construction: numpy.random.SeedSequence
  key_order: [root_seed, family_code, participant_index, block, class_index, component_code]
  development_root_seed: 20260906
  superseded_unexecuted_plaintext_lockbox_root_seed: 20260907
  independent_lockbox_root_seed:
    derivation_revision: nist_beacon_v1
    provider: NIST_Randomness_Beacon_2.0
    official_specification: https://csrc.nist.gov/Projects/interoperable-randomness-beacons/beacon-20
    target_timestamp_utc: '2026-09-05T19:30:00.000Z'
    target_timestamp_unix_milliseconds: 1788636600000
    exact_endpoint: https://beacon.nist.gov/beacon/2.0/pulse/time/1788636600000
    required_exact_pulse_timestamp: '2026-09-05T19:30:00.000Z'
    statement_utf8: 'cfeg.metadata-calibration-efficiency-v2|synthetic-lockbox|v8|2026-09-05T19:30:00.000Z'
    statement_sha256: 11fe3ab3db97a070bacc7b83426a53366e338457275937eef3016f42316afe0e
    output_value_encoding: exact_128_uppercase_hex_characters_decoded_to_64_bytes
    digest_formula: SHA256_UTF8_statement_then_LF_then_raw_output_value_bytes
    root_seed_formula: unsigned_big_endian_integer_of_all_32_digest_bytes
    retrieval_not_before_target_timestamp: true
    require_https_nist_host_exact_pulse_fields_and_full_response_receipt: true
  family_codes:
    B1_participant_specific_class_confusion: 101
    B2_participant_phase_spatial_shift: 102
    B3_context_dependent_support_query_shift: 103
    N1_perfect_clean_anchor: 201
    N2_random_fit_support_labels: 202
    N3_nonstationary_corrupted_calibration: 203
    N4_context_independent_of_signal: 204
  component_codes:
    spatial_signature: 1
    class_phase: 2
    block_phase_drift: 3
    channel_gain: 4
    innovation_noise: 5
    label_permutation: 6
    metadata_noise: 7
    metadata_shuffle: 8
    sensitivity_resampling: 9
  order_invariance: every_random_component_has_its_own_complete_key

population:
  participants_per_family_per_seed: 64
  classes: 12
  complete_blocks: 10
  trials_per_class_per_block: 1
  support_budgets: [0, 1, 3, 5]
  nested_support:
    0: []
    1: [1]
    3: [1, 2, 3]
    5: [1, 2, 3, 4, 5]
  immutable_query_blocks: [6, 7, 8, 9, 10]

waveform:
  dtype: float64
  sampling_rate_hz: 250
  duration_seconds: 2.0
  channels: 8
  class_frequency_hz: 8.0_plus_0.4_times_zero_based_class
  harmonic_amplitudes: {1: 1.0, 2: 0.35}
  spatial_signature: normalized_participant_by_class_standard_normal_vector
  class_phase: participant_by_class_uniform_minus_pi_to_pi
  block_phase_drift_radians_sd: 0.08
  channel_gain_distribution: lognormal_meanlog_0_sdlog_0.12
  random_variable_axes:
    spatial_signature: participant_by_intended_class_by_channel_shared_across_blocks
    class_phase: participant_by_frequency_class_shared_across_blocks
    block_phase_drift: participant_by_block_shared_across_classes_and_channels
    channel_gain: participant_by_block_by_channel_shared_across_all_class_trials
    cross_frequency_spatial_signature: intended_class_spatial_signature
    impedance_noise: participant_by_block_by_channel_shared_across_all_class_trials
  component_phase_formulas:
    target_harmonic_h: h_times_parenthesized_target_frequency_class_phase_plus_block_phase_drift
    cross_frequency_harmonic_h: >-
      h_times_parenthesized_cross_frequency_class_phase_plus_cross_extra_phase_plus_block_phase_drift
  exact_signal_composition:
    target: >-
      target_amplitude times intended_class_spatial_signature times the sum of
      harmonic 1 and 0.35 times harmonic 2 at generated_target_class frequency
      and phase
    cross_frequency: >-
      cross_amplitude times the same intended_class_spatial_signature times the
      sum of harmonic 1 and 0.35 times harmonic 2 at generated_cross_class
      frequency and phase plus cross_extra_phase
    channel_gain_placement: multiply_target_plus_cross_only_not_AR1_noise
    final: channel_gain_times_parenthesized_target_plus_cross_plus_stationary_AR1_noise
  noise:
    process: stationary_AR1_per_channel
    rho: 0.55
    initialization: epsilon_0_equals_sigma_times_z_0_div_sqrt_1_minus_rho_squared
    recurrence: epsilon_t_equals_rho_times_epsilon_t_minus_1_plus_sigma_times_z_t
  filterbank_config: configs/baselines/fbcca_chen2015_m3_v2_explicit_weights.yaml
  filterbank_config_sha256: b8c1ce4477d980b40f359bc3dc97f3125313191d24401f29a7e2dc473d0d1380
  exact_subband_weights:
    - 1.25
    - 0.6704482076268572
    - 0.5032785618838642
    - 0.42677669529663687
    - 0.38374806099528436
    - 0.35649051737437876
    - 0.33782687899303776
  execution: stream_one_participant_at_a_time_without_persisting_a_full_family_tensor

diagnostic_operator_configs:
  P1:
    operator: score_prototype_shrinkage
    ideal_prototype_smoothing: 0.05
    prototype_prior_pseudocount: 4.0
    lambda_max: 0.10
    entropy_scaling: true
  P2:
    operator: filterbank_target_template_residual
    lambda_max: 0.10
    entropy_scaling: true
    input_path: filtered_subband_only
  A_QM:
    different_interface_affinity: 0.25
    relative_context_pairing_sha256_required: true
  note: >-
    These are fixed diagnostic settings and do not select the human-data
    candidate. The complete human development grid remains the r4 12-candidate
    grid.

families:
  B1_participant_specific_class_confusion:
    role: beneficial
    target_amplitude: 1.0
    cross_frequency_amplitude: 0.90
    cross_frequency_class: class_plus_1_plus_participant_mod_3_mod_12
    noise_innovation_sd: 0.85
    stationarity: support_and_query_share_the_participant_derangement
    contrast: P1_A_Q_minus_A0_eAUC
  B2_participant_phase_spatial_shift:
    role: beneficial
    target_amplitude: 0.65
    cross_frequency_amplitude: 0.0
    noise_innovation_sd: 1.10
    stationarity: support_and_query_share_participant_class_spatial_and_phase_signature
    contrast: P2_A_Q_minus_A0_eAUC
  B3_context_dependent_support_query_shift:
    role: beneficial_metadata
    block_state: minus_one_for_odd_block_plus_one_for_even_block
    target_amplitude: 1.0
    matched_cross_frequency_amplitude: 0.75
    matched_cross_frequency_class: class_plus_1_plus_participant_mod_3_mod_12
    state_minus_one_odd_block_regime:
      cross_frequency_class: matched_cross_frequency_class
      extra_phase_radians: 0.0
      noise_innovation_sd: 0.85
    state_plus_one_even_block_regime:
      cross_frequency_class: opposite_cross_frequency_class
      extra_phase_radians: 1.5707963267948966
      noise_innovation_sd: 1.30
    opposite_cross_frequency_class: class_plus_4_plus_participant_mod_3_mod_12
    opposite_extra_phase_radians: 1.5707963267948966
    opposite_noise_innovation_sd: 1.30
    impedance_kohm: exp_log6_plus_0.65_times_state_plus_normal_0_0.05_minus_1
    interface: participant_constant
    pairing_controls:
      correct: exact_query_and_support_block_packets
      pair_shuffled: >-
        keep EEG and labels fixed and permute whole support metadata packets
        only within the currently available fit/support prefix with the
        metadata_shuffle RNG component; never source an evaluation, query, or
        future block; exact no-op when the prefix contains one block
      stale: >-
        circularly_shift whole support metadata packets by one position only
        within the currently available fit/support prefix; never source an
        evaluation, query, or future block; exact no-op when the prefix
        contains one block
      opposite_interface: replace_support_interface_with_a_distinct_fixed_category
      all_missing: remove_all_comparable_context_fields
    contrast: P1_A_QM_correct_minus_identical_P1_A_Q_eAUC
    mechanism_contrast: P1_A_QM_correct_minus_P1_A_QM_pair_shuffled_eAUC
  N1_perfect_clean_anchor:
    role: null
    target_amplitude: 2.0
    cross_frequency_amplitude: 0.0
    noise_innovation_sd: 0.05
    contrasts:
      - P1_A_Q_minus_A0_by_budget
      - P2_A_Q_minus_A0_by_budget
  N2_random_fit_support_labels:
    role: adversarial_gate
    waveform: B1_with_target_amplitude_1_cross_amplitude_0.90_noise_sd_0.85
    fit_label_rule: >-
      When a block enters a fit prefix, apply a keyed non-identity cyclic
      permutation to its recorded support labels. The next evaluation block is
      scored against its immutable true stimulus labels; query labels remain
      inaccessible until evaluation.
    contrast: P1_gate_abstention_at_k3_and_k5
  N3_nonstationary_corrupted_calibration:
    role: adversarial_gate
    calibration_blocks_1_to_5: >-
      Replace the dominant target component for intended class c in block b by
      class (c+b) mod 12 while retaining recorded stimulus label c. Each block
      therefore has a different corruption and prior prefixes cannot predict
      the next block.
    shifted_component_convention: >-
      Use the shifted class frequency and shifted class phase but retain the
      intended recorded class c spatial signature.
    query_blocks_6_to_10: clean_moderate_target_amplitude_1_noise_sd_0.85
    contrast: P1_gate_abstention_at_k3_and_k5
  N4_context_independent_of_signal:
    role: null_metadata
    waveform: B3_marginal_signal_mixture_with_signal_state_keyed_independently
    signal_state_draw: keyed_Bernoulli_one_half_mapped_to_minus_one_or_plus_one
    context: impedance_and_interface_packet_keyed_independently_of_signal_state
    context_state_draw: separate_keyed_Bernoulli_one_half_mapped_to_minus_one_or_plus_one
    exchangeability: correct_and_pair_shuffled_metadata_are_exchangeable
    contrasts:
      - P1_A_QM_minus_identical_P1_A_Q_by_budget
      - P1_A_QM_correct_minus_pair_shuffled_eAUC

prequential_gate:
  k0: exact_A0_without_support_access
  k1: explicit_synthetic_global_gate_enabled_true
  k3_folds:
    - {evaluation_block: 2, fit_blocks: [1]}
    - {evaluation_block: 3, fit_blocks: [1, 2]}
  k5_folds:
    - {evaluation_block: 2, fit_blocks: [1]}
    - {evaluation_block: 3, fit_blocks: [1, 2]}
    - {evaluation_block: 4, fit_blocks: [1, 2, 3]}
    - {evaluation_block: 5, fit_blocks: [1, 2, 3, 4]}
  candidate_probability: final_fused_probability_not_raw_support_probability
  typed_prefix_provenance_required: true
  query_application: use_gate_decision_as_explicit_authorization

metrics:
  participant_balanced_accuracy_by_budget: true
  eAUC_formula: Y0_div_6_plus_Y1_div_2_plus_Y3_div_3
  decision_interval: one_sided_paired_t_95_percent_lower_bound
  observed_minimum_gain: 0.01
  noninferiority_margin: -0.016666666666666666
  severe_harm_definition: participant_eAUC_delta_less_than_-0.10
  severe_harm_upper_bound:
    method: one_sided_exact_Clopper_Pearson_95_percent
    threshold: 0.10
  sensitivity_only:
    sign_flip:
      method: keyed_monte_carlo
      draws: 100000
      seed_component: sensitivity_resampling
    participant_bootstrap:
      draws: 10000
      seed_component: sensitivity_resampling

promotion_requirements:
  helpful_families:
    rule: at_least_two_of_B1_B2_B3_pass
    each_pass_requires:
      - paired_t_one_sided_95_percent_LCB_greater_than_0
      - observed_mean_gain_at_least_0.01
  B3_pairing_mechanism:
    observed_mean_correct_minus_pair_shuffled_eAUC_at_least: 0.01
  null_noninferiority:
    N1: >-
      For P1-A0 and P2-A0 at each k in [1,3,5], the paired-t one-sided 95
      percent lower bound must exceed -1/60.
    N4: >-
      For AQM-AQ at each k in [1,3,5], the paired-t one-sided 95 percent lower
      bound must exceed -1/60.
  adversarial_prequential_abstention:
    denominator: all_N2_and_N3_participant_decisions_at_k3_and_k5
    minimum_rate: 0.95
    k1_excluded_because_no_local_validation: true
  severe_harm:
    scope: exact_declared_participant_eAUC_safety_set
    contrast_ids:
      - B1:P1_A_Q-A0:eAUC
      - B2:P2_A_Q-A0:eAUC
      - B3:P1_A_QM_correct-P1_A_Q:eAUC
      - N1:P1_A_Q-A0:eAUC
      - N1:P2_A_Q-A0:eAUC
      - N2:P1_A_Q-A0:eAUC
      - N3:P1_A_Q-A0:eAUC
      - N4:P1_A_QM_correct-P1_A_Q:eAUC
    mechanism_contrasts_are_not_participant_harm_estimands: true
    exact_binomial_95_percent_upper_rate_less_than: 0.10

hard_assertions_before_efficacy:
  - k0_bitwise_exact_A0
  - missing_or_false_gate_bitwise_A0_without_support_access
  - all_missing_AQM_bitwise_AQ
  - query_and_support_reorder_invariance
  - class_and_codebook_equivariance
  - no_query_label_or_identity_operator_API
  - finite_probability_simplex
  - L1_probability_displacement_at_most_two_lambda
  - exact_seven_P2_weights
  - prefix_template_and_pairing_provenance_rejection_and_echo
  - every_context_control_donor_is_inside_current_prefix
  - public_primitives_reject_both_reserved_seeds
  - lockbox_seed_global_claim_is_canonical_and_no_replace

freeze_and_stopping:
  canonical_execution_paths:
    preparation_receipt: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/synthetic/preparation.json
    development_result: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/synthetic/development-seed-20260906.json
    full_suite_test_evidence: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/synthetic/prelockbox-full-suite-tests.json
    beacon_receipt: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/synthetic/nist-beacon-20260905T193000Z.json
    lockbox_authorization: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/synthetic/lockbox-authorization-nist-20260905T193000Z.json
    lockbox_result: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/synthetic/lockbox-nist-20260905T193000Z.json
    seed_global_lockbox_claim: >-
      /home/whwovy/v2-artifacts/metadata-calibration-efficiency-v2-20260906/claims/synthetic-lockbox-nist-20260905T193000Z.json
  canonical_paths_are_local_execution_governance_not_portable_data_locations: true
  every_seed_touching_primitive_requires_internal_governed_context_for_reserved_seeds: true
  lockbox_seed_is_reserved_immediately_after_beacon_derivation: true
  lockbox_claim_created_before_any_lockbox_rng_or_participant_generation: true
  alternate_result_path_cannot_create_a_second_lockbox_claim: true
  execution_identity:
    repository_status_scope: entire_worktree_including_untracked_files
    commit: exact_HEAD
    tree: exact_HEAD_tree
    repository_must_be_clean: true
    bind_execution_source_bundle_in_addition_to_full_clean_HEAD: true
    required_environment_fields:
      - python_implementation
      - python_version
      - python_executable_realpath
      - platform
      - numpy_version
      - numpy_configuration_sha256
      - scipy_version
      - thread_environment
    same_environment_sha256_required_for_prepare_development_tests_authorization_and_lockbox: true
  development_result_integrity:
    exact_top_level_and_nested_schemas_required: true
    hard_assertions_completed_before_metrics_must_be_true: true
    hard_assertion_key_set_must_equal_plan_and_every_value_true: true
    exact_participant_metric_rows: 5888
    participant_ids_per_family: exact_zero_through_63
    family_method_budget_grid_must_be_exact_and_unique: true
    exact_primary_contrast_count: 19
    participant_deltas_per_contrast: 64
    recompute_contrasts_and_promotion_from_metric_rows_and_require_canonical_equality: true
    promotion_must_be_evaluated_but_development_pass_is_not_a_lockbox_gate: true
  test_evidence:
    exact_argv: [python_current_environment, -m, pytest, -q]
    working_directory: exact_repository_root
    scope: complete_repository_test_suite
    exit_code: 0
    exclusive_self_hashed_receipt_and_captured_stdout_stderr_sha256_required: true
    same_clean_HEAD_tree_source_bundle_and_environment_required: true
  before_development:
    - config_SHA256_recorded
    - generator_code_commit_recorded
    - unit_and_property_tests_pass
  before_lockbox:
    - development_outputs_recorded_as_engineering_only
    - generator_config_and_code_frozen
    - diagnostic_operator_configs_unchanged
    - exact_full_suite_test_receipt_recorded
    - exact_future_beacon_pulse_recorded_after_source_freeze
    - one_time_lockbox_receipt_created_exclusively
  post_claim_terminal_states:
    promotion_failure: terminal_scientific_fail
    hard_invariant_failure: terminal_invariant_fail
    runtime_IO_OOM_process_or_serialization_failure: consumed_inconclusive_infrastructure_error
    claim_without_result_due_to_uncatchable_termination: consumed_inconclusive_missing_terminal_receipt
    automatic_retry_after_any_post_claim_state: forbidden
    preclaim_validation_failure_may_be_corrected_without_seed_access: true
    caught_postclaim_failure_must_write_exclusive_self_hashed_terminal_receipt: true
    an_existing_seed_global_claim_alone_permanently_consumes_the_lockbox: true
  lockbox_terminal_rule: >-
    Any hard assertion or promotion requirement failure terminates synthetic
    V2 and forbids real independent-gate and wearable-held access. Any
    post-claim infrastructure or implementation failure consumes the lockbox
    and leaves efficacy inconclusive, also forbidding those later phases.
    Retuning
    requires a new schema, new seeds, an explicit pre-outcome amendment, and a
    fresh unobserved synthetic lockbox.
  human_claim_boundary: synthetic_pass_is_necessary_but_never_sufficient
