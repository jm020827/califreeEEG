schema: cfeg.metadata-calibration-v2-synthetic-plan.v1
candidate_id: metadata-calibration-efficiency-v2
generator_revision: v3_pre_outcome_explicit_filterbank_weights
status: frozen_before_any_synthetic_outcome
pre_outcome_amendments:
  - revision: v2_explicit_B3_state_mapping
    reason: >-
      Before either reserved seed was executed, bind the previously implicit
      mapping from the two block states to waveform regimes and bind N4's
      independent state draw. Population, contrasts, thresholds, seeds, and
      stopping rules are unchanged.
  - revision: v3_explicit_filterbank_weights
    reason: >-
      Before either reserved seed was executed, bind the seven diagnostic
      strict-FBCCA weights explicitly. NumPy 1.26 and 2.2 round the former
      power expression differently by one ULP; explicit values retain the
      already frozen operator vector across environments. Population,
      contrasts, thresholds, seeds, and stopping rules are unchanged.
purpose: >-
  Mechanism, leakage, abstention, and implementation validation only. Synthetic
  outcomes cannot establish human EEG efficacy or acquisition-context validity.

information_boundary:
  query_labels_available_to_operator: false
  participant_sample_file_and_row_ids_available_to_operator: false
  a0_scores_must_come_from_frozen_strict_fbcca: true
  analytic_scores_derived_from_labels: forbidden
  development_outputs_may_be_inspected: true
  lockbox_outputs_may_be_revealed_once_after_freeze_receipt: true

rng:
  bit_generator: numpy.random.PCG64DXSM
  construction: numpy.random.SeedSequence
  key_order: [root_seed, family_code, participant_index, block, class_index, component_code]
  development_root_seed: 20260906
  independent_lockbox_root_seed: 20260907
  family_codes:
    B1_participant_specific_class_confusion: 101
    B2_participant_phase_spatial_shift: 102
    B3_context_dependent_support_query_shift: 103
    N1_perfect_clean_anchor: 201
    N2_random_fit_support_labels: 202
    N3_nonstationary_corrupted_calibration: 203
    N4_context_independent_of_signal: 204
  component_codes:
    spatial_signature: 1
    class_phase: 2
    block_phase_drift: 3
    channel_gain: 4
    innovation_noise: 5
    label_permutation: 6
    metadata_noise: 7
    metadata_shuffle: 8
    sensitivity_resampling: 9
  order_invariance: every_random_component_has_its_own_complete_key

population:
  participants_per_family_per_seed: 64
  classes: 12
  complete_blocks: 10
  trials_per_class_per_block: 1
  support_budgets: [0, 1, 3, 5]
  nested_support:
    0: []
    1: [1]
    3: [1, 2, 3]
    5: [1, 2, 3, 4, 5]
  immutable_query_blocks: [6, 7, 8, 9, 10]

waveform:
  dtype: float64
  sampling_rate_hz: 250
  duration_seconds: 2.0
  channels: 8
  class_frequency_hz: 8.0_plus_0.4_times_zero_based_class
  harmonic_amplitudes: {1: 1.0, 2: 0.35}
  spatial_signature: normalized_participant_by_class_standard_normal_vector
  class_phase: participant_by_class_uniform_minus_pi_to_pi
  block_phase_drift_radians_sd: 0.08
  channel_gain_distribution: lognormal_meanlog_0_sdlog_0.12
  noise:
    process: stationary_AR1_per_channel
    rho: 0.55
  filterbank_config: configs/baselines/fbcca_chen2015_m3_v2_explicit_weights.yaml
  filterbank_config_sha256: b8c1ce4477d980b40f359bc3dc97f3125313191d24401f29a7e2dc473d0d1380
  exact_subband_weights:
    - 1.25
    - 0.6704482076268572
    - 0.5032785618838642
    - 0.42677669529663687
    - 0.38374806099528436
    - 0.35649051737437876
    - 0.33782687899303776
  execution: stream_one_participant_at_a_time_without_persisting_a_full_family_tensor

diagnostic_operator_configs:
  P1:
    operator: score_prototype_shrinkage
    ideal_prototype_smoothing: 0.05
    prototype_prior_pseudocount: 4.0
    lambda_max: 0.10
    entropy_scaling: true
  P2:
    operator: filterbank_target_template_residual
    lambda_max: 0.10
    entropy_scaling: true
    input_path: filtered_subband_only
  A_QM:
    different_interface_affinity: 0.25
    relative_context_pairing_sha256_required: true
  note: >-
    These are fixed diagnostic settings and do not select the human-data
    candidate. The complete human development grid remains the r4 12-candidate
    grid.

families:
  B1_participant_specific_class_confusion:
    role: beneficial
    target_amplitude: 1.0
    cross_frequency_amplitude: 0.90
    cross_frequency_class: class_plus_1_plus_participant_mod_3_mod_12
    noise_innovation_sd: 0.85
    stationarity: support_and_query_share_the_participant_derangement
    contrast: P1_A_Q_minus_A0_eAUC
  B2_participant_phase_spatial_shift:
    role: beneficial
    target_amplitude: 0.65
    cross_frequency_amplitude: 0.0
    noise_innovation_sd: 1.10
    stationarity: support_and_query_share_participant_class_spatial_and_phase_signature
    contrast: P2_A_Q_minus_A0_eAUC
  B3_context_dependent_support_query_shift:
    role: beneficial_metadata
    block_state: minus_one_for_odd_block_plus_one_for_even_block
    target_amplitude: 1.0
    matched_cross_frequency_amplitude: 0.75
    matched_cross_frequency_class: class_plus_1_plus_participant_mod_3_mod_12
    state_minus_one_odd_block_regime:
      cross_frequency_class: matched_cross_frequency_class
      extra_phase_radians: 0.0
      noise_innovation_sd: 0.85
    state_plus_one_even_block_regime:
      cross_frequency_class: opposite_cross_frequency_class
      extra_phase_radians: 1.5707963267948966
      noise_innovation_sd: 1.30
    opposite_cross_frequency_class: class_plus_4_plus_participant_mod_3_mod_12
    opposite_extra_phase_radians: 1.5707963267948966
    opposite_noise_innovation_sd: 1.30
    impedance_kohm: exp_log6_plus_0.65_times_state_plus_normal_0_0.05_minus_1
    interface: participant_constant
    pairing_controls:
      correct: exact_query_and_support_block_packets
      pair_shuffled: >-
        keep EEG and labels fixed and permute whole support metadata packets
        across blocks with the metadata_shuffle RNG component
      stale: circularly_shift_support_block_metadata_by_one_block
      opposite_interface: replace_support_interface_with_a_distinct_fixed_category
      all_missing: remove_all_comparable_context_fields
    contrast: P1_A_QM_correct_minus_identical_P1_A_Q_eAUC
    mechanism_contrast: P1_A_QM_correct_minus_P1_A_QM_pair_shuffled_eAUC
  N1_perfect_clean_anchor:
    role: null
    target_amplitude: 2.0
    cross_frequency_amplitude: 0.0
    noise_innovation_sd: 0.05
    contrasts:
      - P1_A_Q_minus_A0_by_budget
      - P2_A_Q_minus_A0_by_budget
  N2_random_fit_support_labels:
    role: adversarial_gate
    waveform: B1_with_target_amplitude_1_cross_amplitude_0.90_noise_sd_0.85
    fit_label_rule: >-
      When a block enters a fit prefix, apply a keyed non-identity cyclic
      permutation to its recorded support labels. The next evaluation block is
      scored against its immutable true stimulus labels; query labels remain
      inaccessible until evaluation.
    contrast: P1_gate_abstention_at_k3_and_k5
  N3_nonstationary_corrupted_calibration:
    role: adversarial_gate
    calibration_blocks_1_to_5: >-
      Replace the dominant target component for intended class c in block b by
      class (c+b) mod 12 while retaining recorded stimulus label c. Each block
      therefore has a different corruption and prior prefixes cannot predict
      the next block.
    query_blocks_6_to_10: clean_moderate_target_amplitude_1_noise_sd_0.85
    contrast: P1_gate_abstention_at_k3_and_k5
  N4_context_independent_of_signal:
    role: null_metadata
    waveform: B3_marginal_signal_mixture_with_signal_state_keyed_independently
    signal_state_draw: keyed_Bernoulli_one_half_mapped_to_minus_one_or_plus_one
    context: impedance_and_interface_packet_keyed_independently_of_signal_state
    context_state_draw: separate_keyed_Bernoulli_one_half_mapped_to_minus_one_or_plus_one
    exchangeability: correct_and_pair_shuffled_metadata_are_exchangeable
    contrasts:
      - P1_A_QM_minus_identical_P1_A_Q_by_budget
      - P1_A_QM_correct_minus_pair_shuffled_eAUC

prequential_gate:
  k0: exact_A0_without_support_access
  k1: explicit_synthetic_global_gate_enabled_true
  k3_folds:
    - {evaluation_block: 2, fit_blocks: [1]}
    - {evaluation_block: 3, fit_blocks: [1, 2]}
  k5_folds:
    - {evaluation_block: 2, fit_blocks: [1]}
    - {evaluation_block: 3, fit_blocks: [1, 2]}
    - {evaluation_block: 4, fit_blocks: [1, 2, 3]}
    - {evaluation_block: 5, fit_blocks: [1, 2, 3, 4]}
  candidate_probability: final_fused_probability_not_raw_support_probability
  typed_prefix_provenance_required: true
  query_application: use_gate_decision_as_explicit_authorization

metrics:
  participant_balanced_accuracy_by_budget: true
  eAUC_formula: Y0_div_6_plus_Y1_div_2_plus_Y3_div_3
  decision_interval: one_sided_paired_t_95_percent_lower_bound
  observed_minimum_gain: 0.01
  noninferiority_margin: -0.016666666666666666
  severe_harm_definition: participant_eAUC_delta_less_than_-0.10
  severe_harm_upper_bound:
    method: one_sided_exact_Clopper_Pearson_95_percent
    threshold: 0.10
  sensitivity_only:
    sign_flip:
      method: keyed_monte_carlo
      draws: 100000
      seed_component: sensitivity_resampling
    participant_bootstrap:
      draws: 10000
      seed_component: sensitivity_resampling

promotion_requirements:
  helpful_families:
    rule: at_least_two_of_B1_B2_B3_pass
    each_pass_requires:
      - paired_t_one_sided_95_percent_LCB_greater_than_0
      - observed_mean_gain_at_least_0.01
  B3_pairing_mechanism:
    observed_mean_correct_minus_pair_shuffled_eAUC_at_least: 0.01
  null_noninferiority:
    N1: >-
      For P1-A0 and P2-A0 at each k in [1,3,5], the paired-t one-sided 95
      percent lower bound must exceed -1/60.
    N4: >-
      For AQM-AQ at each k in [1,3,5], the paired-t one-sided 95 percent lower
      bound must exceed -1/60.
  adversarial_prequential_abstention:
    denominator: all_N2_and_N3_participant_decisions_at_k3_and_k5
    minimum_rate: 0.95
    k1_excluded_because_no_local_validation: true
  severe_harm:
    scope: every_declared_primary_family_contrast
    exact_binomial_95_percent_upper_rate_less_than: 0.10

hard_assertions_before_efficacy:
  - k0_bitwise_exact_A0
  - missing_or_false_gate_bitwise_A0_without_support_access
  - all_missing_AQM_bitwise_AQ
  - query_and_support_reorder_invariance
  - class_and_codebook_equivariance
  - no_query_label_or_identity_operator_API
  - finite_probability_simplex
  - L1_probability_displacement_at_most_two_lambda
  - exact_seven_P2_weights
  - prefix_template_and_pairing_provenance_rejection_and_echo

freeze_and_stopping:
  before_development:
    - config_SHA256_recorded
    - generator_code_commit_recorded
    - unit_and_property_tests_pass
  before_lockbox:
    - development_outputs_recorded_as_engineering_only
    - generator_config_and_code_frozen
    - diagnostic_operator_configs_unchanged
    - one_time_lockbox_receipt_created_exclusively
  lockbox_terminal_rule: >-
    Any hard assertion or promotion requirement failure terminates synthetic
    V1 and forbids real independent-gate and wearable-held access. Retuning
    requires a new schema, new seeds, an explicit pre-outcome amendment, and a
    fresh unobserved synthetic lockbox.
  human_claim_boundary: synthetic_pass_is_necessary_but_never_sufficient
