research_goal: >-
  Minimize the labeled target-user calibration burden required for useful
  closed-set SSVEP decoding on unseen participants. Treat k=0 as the
  calibration-free anchor and k>0 as explicitly supervised low-calibration
  operation.
research_question: >-
  At the same target-participant calibration budget, does pre-query acquisition
  context improve the early calibration curve beyond EEG, structural inputs and
  query-derived quality information alone?
claim_name: pre_query_acquisition_context_assisted_low_calibration_ssvep
generic_metadata_claim_allowed: false

problem_signature:
  representation: >-
    Two-second, 200-Hz, 12-class wearable SSVEP queries with a source-trained
    spectral decoder and a small target-support calibration estimator.
  bottleneck: >-
    Labeled target calibration is costly; the prior direct physical-hybrid
    conditioner failed its development mechanism gate, while the only local
    human asset with within-corpus acquisition-context variation is wearable_v3.
  allowed_operation: >-
    Learn from source participants and from an explicitly labeled, nested target
    support set; use only metadata observed before the corresponding block.
  objective: >-
    Increase participant-level normalized early-budget AUC over k=0,1,3 and,
    conditionally, establish prespecified complete calibration-block savings.
  resource_constraint: >-
    One RTX 4090, a permanently retired S1-S3 development cohort, and one
    still-unrevealed S4-S102 allocation that must not become an iterative target.
  feedback_signal: >-
    Outcome-free invariants first, source-only nested development second, and one
    atomic held-participant query reveal only after the frozen source gate passes.
  failure_mode: >-
    Reusing the retired physical_hybrid_v1 under a new name, counting
    query-derived QC as external metadata, mixing calibration blocks, tuning on
    held query outcomes, or interpreting dataset identity as a physical factor.

