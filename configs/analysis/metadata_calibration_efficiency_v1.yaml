estimands:
  participant_unit: true
  seed_class_block_or_support_draw_as_independent_n: false
  primary:
    name: normalized_early_budget_auc_increment
    budgets: [0, 1, 3]
    formula: eAUC_equals_Y0_over_6_plus_Y1_over_2_plus_Y3_over_3
    contrast: eAUC_A_QM_minus_eAUC_A_Q
    alternative: greater_than_zero
    alpha: 0.05
    inference: one_sided_participant_paired_t_with_sign_flip_and_bootstrap_sensitivity
    source_training_seeds: [42, 43, 44]
    seed_reduction: average_class_probabilities_per_query_before_argmax
    tie_break: lowest_canonical_class_id
    any_missing_role_budget_condition_or_seed: invalidate_primary
  key_secondary:
    - A_QM_minus_A_Q_at_k0
    - A_QM_minus_A_Q_at_k1
    - A_QM_minus_A_Q_at_k3
    - A_QM_minus_A_Q_at_k5_saturation
    - wet_and_dry_condition_specific_effects
    - participant_lower_tail_and_model_by_budget_interaction
  equivalent_calibration_savings:
    confirmatory_only_after_primary_pass: true
    confirmatory_contrast: A_QM_k1_noninferior_to_A_Q_k3
    calibration_value_subgate:
      contrast: A_Q_k3_superior_to_A_Q_k1
      alternative: greater_than_zero
      alpha: 0.05
      observed_mean_min: 0.020
      role: inferential_claim_admissibility
    descriptive_contrasts:
      - A_QM_k0_noninferior_to_A_Q_k1
      - A_QM_k3_noninferior_to_A_Q_k5
    alpha: 0.025
    noninferiority_margin: 0.016666666666666666
    margin_semantic_unit: >-
      one_mean_additional_error_per_interface_sixty_queries_equivalently_two_total_errors_across_equal_dry_wet_participant_outcome
    margin_sign_convention: pass_when_lower_CI_of_lower_budget_A_QM_minus_higher_budget_A_Q_exceeds_negative_margin
    operational_balanced_accuracy_floor: 0.50
    margin_status: owner_delegated_agent_freeze_one_additional_error_per_sixty_queries
    inverse_curve_or_interpolated_savings: descriptive_only
  confirmatory_core:
    stage_H1: primary_eAUC_superiority
    stage_H2_intersection:
      - calibration_value_A_Q_k3_over_k1
      - A_QM_k1_noninferior_to_A_Q_k3
    multiplicity: serial_gatekeeping_then_intersection_union_no_alpha_split
  key_mechanism_family:
    endpoints:
      - correct_context_over_block_shuffle
      - correct_context_over_stale
    inference: one_sided_participant_paired_t
    multiplicity: holm_alpha_0p05_after_confirmatory_core
    stale_role: supportive_sensitivity
  deployment_safety:
    wrong_context_mean: one_sided_noninferiority_alpha_0p025
    wrong_context_tail: required_participant_tail_report
    failure_effect: forbid_robust_or_safe_deployment_claim_without_reversing_correct_context_efficacy
  promotion_sesoi: 0.020
  calibration_value_sesoi: 0.020
  mechanism_sesoi: 0.010
  sesoi_status: owner_delegated_agent_freeze_two_point_eAUC_increment
  held_wrong_context_tail_safety:
    severe_harm_cutoff: -0.05
    severe_harm_participants_max: 6
    catastrophic_harm_floor: -0.10
    role: required_safety_report_not_fixed_sequence_gate

