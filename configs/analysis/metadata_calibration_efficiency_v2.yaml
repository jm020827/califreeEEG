    budgets: [0, 1, 3]
    formula: Y0_over_6_plus_Y1_over_2_plus_Y3_over_3
  primary:
    contrast: participant_eAUC_A_QM_minus_A_Q
    alternative: greater_than_zero
    alpha: 0.05
    inference: one_sided_participant_paired_t_with_sign_flip_and_bootstrap_sensitivity
    observed_SESOI: 0.020
  calibration_savings:
    open_only_after_primary: true
    calibration_value: A_Q_k3_minus_A_Q_k1_observed_mean_ge_0p020_and_LCB_gt_0
    savings: A_QM_k1_minus_A_Q_k3_LCB_gt_minus_0p016666666666666666
