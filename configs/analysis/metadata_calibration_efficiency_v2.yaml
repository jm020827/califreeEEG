    1: [block01]
    3: [block01, block02, block03]
    5: [block01, block02, block03, block04, block05]
  wearable_query: [block06, block07, block08, block09, block10]
  external_four_block_support: {1: [block01], 3: [block01, block02, block03]}
  external_four_block_query: [block04]
