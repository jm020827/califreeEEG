research_goal: strict_inductive_k0_ssvep_for_unseen_participants
research_question: >-
  With no external metadata, target history, target calibration, class-frequency
  template, phase template, or target-batch statistic, does a source-trained
  bounded spatial operator conditioned only on the current EEG query at inference
  improve unseen-participant SSVEP decoding in BETA's three-second-stimulation-
  eligible S16-to-S70 population over the exact identity arm under the same
  corruption-training condition?
hypothesis_scope:
  primary: current_query_Q_bundle_conditioned_system_utility_under_seen_synthetic_stress
  conditional_secondary: query_derived_reliability_mechanism_only_if_all_mechanism_audits_pass
  not_claimed:
    - calibrated_physical_signal_quality
    - causal_effect_of_contact_or_impedance
    - discovery_of_new_stimulus_classes
    - general_domain_generalization_beyond_the_observed_corpora
    - first_query_local_or_quality_aware_ssvep_method

information_rights:
  setting: strict_inductive_single_query_k0
  allowed_at_prediction:
    - current_preprocessed_eeg_window
    - current_window_channel_mask
    - fixed_canonical_channel_identity
    - current_window_pre_zscore_channel_scale_qc
  forbidden_at_prediction:
    - external_acquisition_metadata
    - subject_or_dataset_identity
    - target_participant_history
    - target_calibration_trials
    - pseudo_labels
    - target_batch_or_population_statistics
    - ground_truth_label
    - stimulus_frequency_or_phase_template
  supervised_source_training_note: >-
    Source labels train the closed-set classifier and the network may learn
    frequency structure from source waveforms. "Label/frequency-template-free"
    refers only to the absence of an explicit target label or stimulus template
    at prediction time.
  metadata_contract_0_4_dev_role: query_qc_tensor_transport_only

