model_contract:
  architecture: query_reliability_spatial_v1
  backbone: spectral_transformer
  query_feature_schema: query_window_reliability_features_v3_waveform_6_60_qc_scale_6_90
  query_features:
    - pre_zscore_channel_std
    - pre_zscore_qc_available
    - post_zscore_log_variance
    - log_first_difference_energy
    - mean_absolute_interchannel_correlation
    - max_absolute_interchannel_correlation
    - bandmatched_max_bin_spectral_concentration_6_60hz
  placement: pre_backbone_waveform
  operator_family_identifier: diagonal_low_rank
  operator_structure: symmetric_diagonal_plus_low_rank
  factor_width: 4
  symmetric_low_rank_component_rank_upper_bound: 8
  note_on_rank: >-
    Symmetrizing L R^T as (L R^T + R L^T) gives an off-diagonal
    low-rank component with rank at most twice the factor width. The separate
    diagonal term is not rank constrained.
  maximum_frobenius_norm: 0.20
  identity_initialized: true
  external_metadata_parameters_allowed: false
  treatment_information_difference: >-
    Q1 intentionally receives the seven-feature Q bundle, including stored
    pre-zscore channel scale from the 6-90-Hz preprocessing pass, while Q0 does
    not. All waveform-derived Q features are recomputed over the same 6-60-Hz
    band used by the backbone. This estimates the bundle's incremental value,
    not a same-information architecture effect.

experiment:
  design: query_access_by_corruption_training_2x2
  roles: [Q0_CLEAN, Q1_CLEAN, Q0_AUG, Q1_AUG]
  treatment_axes: [query_qc_access, preregistered_corruption_training]
  seeds: [11, 29, 47]
  epochs: 10
  checkpoint_selection: fixed_epoch_blind
  validation_set_exists: false
  checkpoint_or_hyperparameter_selection_data: wang_development_evidence_only
  partial_role_execution_allowed: false
  all_four_roles_per_seed_required: true
  primary_pair: Q1_AUG_minus_Q0_AUG
  required_descriptive_contrasts:
    clean_query_effect_without_augmentation: Q1_CLEAN_minus_Q0_CLEAN
    corrupted_query_effect_without_augmentation: Q1_CLEAN_minus_Q0_CLEAN
    clean_query_by_augmentation_interaction: >-
      (Q1_AUG_minus_Q0_AUG)_clean_minus_(Q1_CLEAN_minus_Q0_CLEAN)_clean
    corrupted_query_by_augmentation_interaction: >-
      (Q1_AUG_minus_Q0_AUG)_corrupted_minus_(Q1_CLEAN_minus_Q0_CLEAN)_corrupted
    corrupted_deployment_comparison: Q1_AUG_minus_Q0_CLEAN
  descriptive_contrasts_are_promotion_tests: false
  corrupted_deployment_comparison_gate_status: utility_threshold_not_yet_frozen
  claim_if_deployment_gate_remains_absent: >-
    Improvement over the identity system under the same augmentation condition
    on the prespecified equal-weight six-cell synthetic-stress composite only.
  forbidden_claim_if_deployment_gate_remains_absent: >-
    Superiority of the proposed deployment system over the standard clean-trained
    identity baseline.
  corruption_cells_equal_weight:
    - zero_0125
    - zero_0250
    - white_snr_0
    - white_snr_m5
    - line50_snr_0
    - line50_snr_m5
  augmented_training_clean_probability: 0.25
  augmented_training_draw_key: fixed_corruption_seed_plus_epoch_plus_sample_id
  corruption_randomization_pairing: >-
    Severity pairs share the same family-keyed channel permutation, white-noise
    realization, or line phase. The 12.5-percent zero set is nested inside the
    25-percent zero set for the same query and draw.
  noise_snr_band_hz: [6.0, 60.0]
  corruption_restandardization_band_hz: [6.0, 90.0]
  corruption_qc_transport: >-
    White noise is limited and scaled in the 6-60-Hz analysis band. It is added
    to the already 6-90-Hz-filtered waveform, then the affected channel is
    restandardized using its full stored 6-90-Hz waveform standard deviation;
    the same relative standard-deviation change transports the pre-z scale QC.
  evaluation_corruption_seed: 20260904
  evaluation_draw_indices: [0, 1, 2]
  corruption_interpretation: injected_flatline_or_noise_only_not_real_contact_or_motion
  same_checkpoint_wrong_query_audit:
    checkpoint_role: Q1_AUG
    information_rights_status: analysis_only_counterfactual_non_deployable
    target_scenarios: clean_plus_all_six_corruption_cells_and_three_draws
    donor_scenario: same_eval_cell_and_draw_as_target
    pairing: deterministic_bijective_within_participant_and_class_nonself_trial
    label_use_boundary: offline_pair_construction_only_never_model_input_or_deployment
    uses_other_trial_from_same_target_participant: true
    strict_k0_deployment_rights_satisfied: false
    target_waveform_route: target_waveform_enters_backbone
    donor_query_route: donor_waveform_and_donor_channel_qc_construct_spatial_operator_only
    channel_layout_mask_and_sampling_rate_must_match: true
    training_use_allowed: false
    excluded_from_primary_clean_and_deployment_estimands: true
    generated_only_inside_same_hidden_atomic_transaction_after_standard_predictions: true
    presentation_as_deployment_comparator_allowed: false

estimands:
  statistical_unit: participant
  seed_reduction: average_three_seed_probabilities_before_participant_metric
  exact_reduction_order:
    - softmax_logits_within_checkpoint
    - arithmetic_mean_probabilities_across_seeds_per_sample
    - argmax_with_lowest_class_index_tie_break
    - balanced_accuracy_per_participant_cell_and_corruption_draw
    - arithmetic_mean_over_three_draws_within_cell
    - equal_weight_arithmetic_mean_over_six_cells_within_participant
    - paired_participant_contrast
  primary: >-
    Mean paired participant balanced-accuracy difference Q1_AUG minus Q0_AUG,
    after equal-weight averaging within participant over the six fixed corrupted
    evaluation cells.
  clean_safety: paired_participant_clean_balanced_accuracy_Q1_AUG_minus_Q0_AUG
  deployment_clean_safety: paired_participant_clean_balanced_accuracy_Q1_AUG_minus_Q0_CLEAN
  provisional_gates_not_yet_frozen:
    primary_mean_delta_min: 0.02
    primary_one_sided_alpha: 0.05
    primary_positive_participant_fraction_min: 0.60
    clean_noninferiority_margin: -0.01
    clean_one_sided_alpha: 0.05
    deployment_clean_noninferiority_margin: -0.01
    deployment_clean_one_sided_alpha: 0.05
    joint_rule: >-
      Intersection-union: corrupted superiority LCB above zero and observed mean
      at least 0.02, Q1_AUG-vs-Q0_AUG clean LCB above -0.01, and
      Q1_AUG-vs-Q0_CLEAN clean LCB above -0.01.
    positive_fraction_role: >-
      A non-inferential consistency promotion gate requiring at least 12 of 20
      participant contrasts above zero; no sign-test p-value is claimed. Under
      independent 0.5 signs, 12-or-more occurs with probability about 0.252.
    statistical_procedure: >-
      For each paired participant contrast, use a one-sample mean t lower
      confidence bound with ddof=1 and one-sided alpha 0.05. There is no
      normality pretest or outcome-dependent method switch. If variance is
      exactly zero, the LCB equals the mean and p is 0 only when the mean is
      strictly above the null margin, otherwise 1. Exact sign-flip and bootstrap
      results may be reported only as prespecified sensitivities.
  why_provisional: >-
    The +0.02 practical threshold is below the 3.5-to-6.5 percentage-point
    gains over channel ensemble reported in the MAPS-CS PubMed-indexed author
    abstract, but that cross-study result does not by itself justify our
    threshold. It is an observed-effect promotion threshold rather than the inferential null. The
    -0.01 clean margins still need utility justification. The completed
    outcome-free sensitivity audit shows that at N=20, true clean delta zero,
    and paired SD 0.04, one clean noninferiority test has only about 0.286 power;
    80-percent power requires paired SD about 0.0173 or smaller (or roughly 101
    participants at SD 0.04). The +0.02 value is an observed promotion screen,
    not a tested population lower bound. Numeric utility choices and the final
    simulation grid remain unfrozen and cannot authorize an outcome reveal.
  noninferiority_failure_interpretation: >-
    Failure means clean safety was not established for promotion; it is not by
    itself evidence that the method causes harm.
  outcome_free_sensitivity_audit:
    document: docs/query_reliability_power_sensitivity.md
    n_participants: 20
    one_sided_alpha: 0.05
    clean_power_at_true_zero_and_sd_0_04: 0.2855
    clean_sd_for_80_percent_power_at_true_zero: 0.0173
    approximate_n_for_80_percent_power_at_true_zero_and_sd_0_04: 101
    final_monte_carlo_contract_frozen: false
  within_beta_held_participant_reports_under_seen_synthetic_corruption:
    - participant_by_corruption_cell_paired_deltas
    - worst_corruption_cell_per_participant_and_role_with_lexical_tie_break
    - participant_composite_quantiles_0_10_0_25_0_50_per_role
    - gained_and_lost_cells_at_the_plan_bound_practical_margin
    - corrupted_Q1_AUG_minus_Q0_CLEAN_deployment_comparison
    - clean_and_corrupted_query_by_augmentation_interactions
  corruption_generalization_claim_allowed: false
  corruption_scope_note: >-
    Training and evaluation use the same six corruption families and severities.
    Train and held participants also come from the same BETA corpus, hardware,
    and site. The study therefore tests participant-disjoint robustness under
    prespecified, seen synthetic stresses; it does not estimate device/site/domain
    OOD or generalization to a novel corruption family.
  primary_claim_boundary: >-
    Even if every promotion gate passes, the primary claim is limited to the
    BETA three-second-stimulation-eligible S16-to-S70 population and the
    prespecified equal-weight six-cell synthetic-stress composite relative to the
    identity arm under the same augmentation condition. It does not generalize
    to excluded S1-to-S15. Without a separately frozen corrupted
    Q1_AUG-minus-Q0_CLEAN utility gate, it is not a claim of superiority over the
    standard clean-trained identity baseline, benefit in every corruption cell,
    or broad real-world robustness.

