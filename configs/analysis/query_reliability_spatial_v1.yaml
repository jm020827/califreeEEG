  - exact_Q0_identity_at_every_training_step
  - identical_parameter_schema_and_initial_trainable_state_within_seed
  - metadata_mutation_bitwise_no_effect
  - symmetric_operator_and_norm_bound
  - padded_channel_safety
  - channel_permutation_equivariance
  - batch_partner_independence
  - no_new_temporal_frequency_support
  - injected_channel_localization
  - query_feature_label_probe
  - leave_one_query_feature_family_out_ablation
  - query_feature_dataset_probe_before_cross_corpus_claim
  - no_new_temporal_frequency_or_harmonic_support_and_empirical_phase_shift_report
  - exact_complete_prediction_grid_and_role_seed_input_hash_equality
  - class_by_corruption_cell_report_with_50hz_harmonic_overlap_flag
  - same_checkpoint_Q1_identity_intervention
  - same_checkpoint_Q1_wrong_query_intervention

mechanism_attribution_boundary:
  primary_claim_if_gates_pass: >-
    incremental_utility_of_the_exact_Q_bundle_conditioned_system_over_the_frozen_identity_baseline
  primary_contrast_does_not_isolate: >-
    reliability_information_from_query_dependent_operator_function_and_effective_function_capacity
  reliability_mechanism_claim_requires:
    - injected_channel_localization_pass
    - source_and_sealed_bundle_query_feature_label_probe
    - leave_one_feature_family_out_ablation
    - no_single_class_or_50hz_harmonic_cell_dominates_the_effect
    - same_checkpoint_Q1_identity_intervention_pass
    - same_checkpoint_Q1_wrong_query_intervention_pass
  provisional_same_checkpoint_estimands:
    identity: >-
      participant corrupted composite Q1_AUG active minus the same checkpoint
      with the spatial operator forced to exact identity
    wrong_query: >-
      participant corrupted composite Q1_AUG active minus the same checkpoint
      using the fixed within-participant/class nonself donor-Q operator
    inferential_null_margin: 0.0
    one_sided_alpha: 0.05
    practical_effect_threshold: null
    failure_scope: blocks_reliability_mechanism_claim_only_not_primary_utility_result
    status: thresholds_and_artifact_reducer_not_frozen
  caveat: >-
    First-difference energy and spectral concentration can contain task-frequency
    information even though neither receives a class-frequency template. They
    are lawful single-query inputs, but benefit without the listed audits is a
    Q-bundle-conditioned system effect, not evidence of bad-channel recovery.

