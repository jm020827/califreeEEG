prior_art_boundary:
  novelty_clearance_complete: false
  first_claim_allowed: false
  closest_methods:
    - name: MAPS-CS
      year: 2026
      doi: 10.1016/j.jneumeth.2026.110757
      relevance: training_free_dynamic_ssvep_channel_quality_selection
      evidence_status: abstract_only_full_text_required
    - name: Dynamic Spatial Filtering
      year: 2022
      doi: 10.1016/j.neuroimage.2022.118994
      relevance: current_window_covariance_conditioned_spatial_operator
      evidence_status: full_text_reviewed
    - name: Fast SSVEP
      year: 2025
      url: https://arxiv.org/abs/2506.01284
      relevance: query_local_alignment_and_spectral_denoising
      evidence_status: preprint_reviewed
    - name: SSVEPPoolformer
      year: 2025
      doi: 10.1109/TCE.2025.3535157
      relevance: adaptive_denoising_and_cross_channel_pooling_for_ssvep
      evidence_status: official_abstract_only_full_text_required
    - name: TMW-CCA
      year: 2022
      doi: 10.1109/JIOT.2021.3113910
      relevance: time_domain_quality_aware_dynamic_ssvep_sensing
      evidence_status: full_text_required
    - name: EMD-QC
      year: 2025
      doi: 10.2139/ssrn.5622956
      relevance: signal_quality_weighted_cca_and_channel_selection
      evidence_status: full_text_blocked
  candidate_contribution_if_all_gates_and_replication_complete: >-
    A source-trained, bounded diagonal-plus-low-rank SSVEP operator conditioned
    only on the current query, with no explicit target label or frequency/phase
    template at inference, evaluated with exact graph
    parity, participant-disjoint data, clean mean noninferiority at a prespecified
    minus-one-percentage-point margin, injected-corruption
    localization, shortcut audits, temporal-frequency-support audits, and
    prospective within-Dong participant-disjoint retraining replication, provided
    its exact recipe is frozen before any BETA reveal.
  conceptual_lens:
    source: https://arxiv.org/abs/2608.11829
    transfer: >-
      Mean improvement alone may reflect efficiency or redistribution rather than
      expansion of the OOD capability boundary; therefore participant-by-corruption
      win/loss transitions and lower-tail performance are reported separately.

