promotion_requirements:
  rule: all_named_components_must_pass
  invariant_and_potency:
    require_every_invariant: true
    require_k3_derangement_packet_binding_and_scientific_g_M_potency_thresholds: true
  A_Q_viability:
    family_rule: at_least_one_of_B1_or_B2
    each_candidate_family_pass:
      paired_LCB_gt: 0.0
      observed_mean_ge: 0.01
      k1_observed_mean_ge: 0.0
  metadata_efficacy:
    required_families: [B3_impedance_linked_transfer_shift, B4_interface_calibrated_impedance_shift]
    each_family_pass:
      A_QM_minus_A_Q_eAUC_paired_LCB_gt: 0.0
      A_QM_minus_A_Q_eAUC_observed_mean_ge: 0.01
    B4_in_reference_subset_must_also_pass:
      development_participants: 43
      future_scientific_participants: 86
      A_QM_minus_A_Q_eAUC_paired_LCB_gt: 0.0
      A_QM_minus_A_Q_eAUC_observed_mean_ge: 0.01
    B4_interface_scale_value_supportive:
      evaluation_subset: in_reference_participants
      correct_minus_pooled_scale_paired_LCB_gt: 0.0
      correct_minus_pooled_scale_observed_mean_gt: 0.0
      correct_minus_wrong_interface_scale_paired_LCB_gt: 0.0
      correct_minus_wrong_interface_scale_observed_mean_gt: 0.0
  pairing_mechanism:
    k3_correct_minus_within_prefix_shuffle_each_B3_B4:
      paired_LCB_gt: 0.0
      observed_mean_ge: 0.01
  deployment_viability:
    required_families: [B3_impedance_linked_transfer_shift, B4_interface_calibrated_impedance_shift]
    each_family_A_QM_correct_minus_A0_eAUC:
      paired_LCB_gt: -0.016666666666666666
      observed_mean_ge: 0.0
  null_noninferiority:
    N1_clean_anchor:
      contrasts: [A_Q_minus_A0, A_QM_correct_minus_A_Q]
      budgets: [1, 3]
      each_lower_bound_gt: -0.016666666666666666
    N4_context_null:
      contrasts:
        - {id: A_QM_correct_minus_A_Q, budgets: [1, 3]}
        - {id: correct_minus_support_channel_rotation, budgets: [1]}
        - {id: correct_minus_within_prefix_shuffle, budgets: [3]}
      equivalence_interval: two_one_sided_tests_alpha_0p05_equivalently_paired_90_percent_CI
      each_CI_entirely_inside: [-0.016666666666666666, 0.016666666666666666]
  harm_and_abstention:
    severe_harm_contrasts:
      - {family: B1_participant_class_confusion, id: A_Q_minus_A0_eAUC}
      - {family: B2_participant_phase_spatial_shift, id: A_Q_minus_A0_eAUC}
      - {family: B3_impedance_linked_transfer_shift, id: A_QM_correct_minus_A_Q_eAUC}
      - {family: B3_impedance_linked_transfer_shift, id: A_QM_correct_minus_A0_eAUC}
      - {family: B4_interface_calibrated_impedance_shift, id: A_QM_correct_minus_A_Q_equal_condition_eAUC}
      - {family: B4_interface_calibrated_impedance_shift, id: A_QM_correct_minus_A0_equal_condition_eAUC}
      - {family: B4_interface_calibrated_impedance_shift, id: A_QM_pooled_scale_minus_A_Q_equal_condition_eAUC}
      - {family: B4_interface_calibrated_impedance_shift, id: A_QM_wrong_interface_scale_minus_A_Q_equal_condition_eAUC}
    severe_harm_denominator: 48_participants_per_contrast_after_equal_condition_aggregation_for_B4
    each_one_sided_exact_95_percent_upper_rate_lt: 0.10
    adversarial_abstention:
      families: [N2_random_support_labels, N3_nonstationary_calibration]
      budgets: [3, 5]
      unit: participant_by_budget
      development_denominator_each_family: 96
      future_selected_lockbox_denominator_each_family: 192
      numerator: deployed_gate_returns_exact_A0_before_final_query_support_update
      observed_rate_each_family_ge: 0.95
      one_sided_exact_binomial_95_percent_interval_report_required: true
    N5_invalid_context_fallback_contract_rate: 1.0
    no_claim_that_k1_plausible_wrong_labels_are_detectable: true
  anti_triviality:
    helpful_family_metadata_use_definition: support_enabled_and_abs_g_M_minus_1_gt_1e_minus_12
    unit: participant_by_condition_by_query_block_by_budget
    budgets: [1, 3]
    query_blocks: [6, 7, 8, 9, 10]
    denominator_B3: 480
    denominator_B4: 960
    observed_rate_each_of_B3_and_B4_ge: 0.20
    purpose: an_always_A_Q_or_always_abstain_rule_cannot_pass

