  B2_participant_phase_spatial_shift:
    role: beneficial_A_Q
    target_amplitude: 0.65
    confuser_amplitude: 0.0
    noise_innovation_sd: 1.10
    stationarity: support_and_query_share_participant_class_spatial_and_phase_signature
    primary_contrast: A_Q_minus_A0_eAUC

  B3_impedance_linked_transfer_shift:
    role: mandatory_beneficial_metadata
    latent_contact_state: keyed_block_state_minus_one_or_plus_one_balanced_within_participant
    state_minus_one:
      confuser_class: class_plus_1_plus_participant_mod_3_mod_12
      confuser_amplitude: 0.75
      extra_phase_radians: 0.0
      noise_innovation_sd: 0.85
    state_plus_one:
      confuser_class: class_plus_4_plus_participant_mod_3_mod_12
      confuser_amplitude: 0.75
      extra_phase_radians: 1.5707963267948966
      noise_innovation_sd: 1.30
    impedance_kohm: >-
      numpy.expm1(numpy.log1p(6.0) plus 0p65 times state plus 0p04 times
      channel_index_minus_3p5 plus keyed_normal_0_0p05)
    interface: neutral_constant
    reason_M_can_help: impedance_is_a_noisy_pre_query_proxy_for_support_query_regime_match
    primary_contrast: A_QM_correct_minus_A_Q_eAUC
    k1_structural_diagnostic: A_QM_correct_minus_A_QM_support_impedance_channel_rotation_not_a_positive_pairing_or_efficacy_endpoint
    k3_mechanism: A_QM_correct_minus_A_QM_within_prefix_impedance_packet_shuffle

  B4_interface_calibrated_impedance_shift:
    role: mandatory_beneficial_metadata
    interface_categories: [wet, dry]
    condition_contract: support_and_query_are_scored_separately_within_the_same_interface
    latent_contact_state: keyed_block_state_minus_one_or_plus_one_balanced_within_each_interface
    shared_state_minus_one_waveform_regime:
      confuser_class: class_plus_1_plus_participant_mod_3_mod_12
      confuser_amplitude: 0.70
      extra_phase_radians: 0.0
      noise_innovation_sd: 0.85
    shared_state_plus_one_waveform_regime:
      confuser_class: class_plus_4_plus_participant_mod_3_mod_12
      confuser_amplitude: 0.70
      extra_phase_radians: 1.5707963267948966
      noise_innovation_sd: 1.20
    wet_log1p_impedance: numpy_log1p_20_plus_0p20_times_state_plus_0p04_times_channel_index_minus_3p5_plus_normal_0_0p03
    dry_log1p_impedance: numpy_log1p_262_plus_0p80_times_state_plus_0p04_times_channel_index_minus_3p5_plus_normal_0_0p08
    participant_mapping_variation:
      offset_jitter_sd_log1p: 0.15
      positive_slope_multiplier: lognormal_meanlog_0_sdlog_0p20
      measurement_noise_multiplier: lognormal_meanlog_0_sdlog_0p15
    source_range_stress:
      assignment: participant_level_for_both_interfaces_by_smallest_keyed_uniform_rank
      development_participant_count: 5
      future_scientific_participant_count: 10
      development_in_reference_count: 43
      future_scientific_in_reference_count: 86
      query_context_override: >-
        For query blocks 6 through 10, set every available channel's
        source-reference standardized log1p impedance coordinate to exactly
        plus 10.0 after reference fitting; support context and all EEG remain
        generated normally.
      OOD_guard_trigger_is_structurally_guaranteed_for_every_stress_query_with_any_valid_channel: true
      role: test_predeclared_OOD_fallback_without_allowing_fallback_to_create_the_only_efficacy_signal
      mandatory_efficacy_reanalysis: in_reference_participants_must_independently_pass_the_same_B4_metadata_thresholds
      stress_subset_role: safety_and_coverage_only
      OOD_fallback_never_counts_as_helpful_metadata_use: true
    interface_only_control: remove_impedance_and_return_exact_A_Q
    pooled_scale_control: use_the_frozen_pooled_center_and_scale_pair_for_wet_and_dry
    wrong_interface_scale_control: swap_wet_and_dry_center_and_scale_tables_without_changing_EEG_or_impedance
    reason_M_can_help: >-
      interface selects how an impedance change is normalized; the interface
      category alone is constant within each calibration-query condition and
      must not directly affect the prediction
    primary_contrast: A_QM_correct_minus_A_Q_eAUC
    supportive_factor_contrasts:
      - A_QM_interface_scaled_minus_A_QM_pooled_scale_eAUC
      - A_QM_interface_scaled_minus_A_QM_wrong_interface_scale_eAUC
    k1_structural_diagnostic: A_QM_correct_minus_A_QM_support_impedance_channel_rotation_same_interface_not_a_positive_pairing_or_efficacy_endpoint
    k3_mechanism: A_QM_correct_minus_A_QM_within_prefix_impedance_packet_shuffle_same_interface

  N1_clean_anchor:
    role: null_support_and_metadata
    target_amplitude: 2.0
    confuser_amplitude: 0.0
    noise_innovation_sd: 0.05
    contrasts: [A_Q_minus_A0_by_budget, A_QM_minus_A_Q_by_budget]

  N2_random_support_labels:
    role: adversarial_prequential_gate
    waveform: same_as_B1
    fit_label_rule: keyed_nonidentity_cyclic_permutation_per_support_block
    evaluation_and_query_labels: immutable_true_labels_unavailable_to_operator
    contrast: deployed_support_update_abstention_at_k3_and_k5

  N3_nonstationary_calibration:
    role: adversarial_prequential_gate
    calibration_blocks: replace_dominant_class_c_component_by_class_c_plus_block_mod_12
    query_blocks: clean_target_amplitude_1_noise_sd_0p85
    contrast: deployed_support_update_abstention_at_k3_and_k5

  N4_context_null:
    role: null_metadata
    waveform: B3_marginal_signal_mixture_with_independent_signal_state
    context: impedance_packet_with_independent_context_state_and_valid_interface_scale
    exchangeability: correct_and_pair_shuffled_context_are_exchangeable
    contrasts: [A_QM_minus_A_Q_by_budget, correct_minus_control_by_budget]

  N5_invalid_context:
    role: observable_context_guard
    cases:
      - unknown_interface_category
      - negative_impedance
      - nonfinite_impedance
      - wrong_channel_count
      - packet_key_or_pairing_digest_mismatch
      - query_source_standardized_OOD
    expected: >-
      malformed_schema_or_pairing_returns_exact_A0_before_support_access;
      unknown_interface_uses_pooled_scale;
      invalid_channels_are_missing_and_all_missing_returns_exact_A_Q

  N6_support_reliability_invariants:
    role: deterministic_signal_Q_weighting_guard
    cases:
      - uniform_chance_probabilities
      - all_observed_label_probabilities_below_chance
      - one_corrupt_block_among_three
      - confident_wrong_anchor_probabilities
    expected: >-
      reliability weights are finite, positive, normalized, use immutable
      strict-FBCCA support probabilities only, are bitwise identical in A_Q
      and A_QM, reduce to weight one at k1, and no evaluation block label
      contributes to its own prequential prediction; low anchor correctness
      never creates an absolute support-disable gate

context_controls:
  correct: exact_query_and_support_acquisition_packets
  all_missing: remove_every_comparable_field_and_return_exact_A_Q
  k1_support_impedance_channel_rotation:
    rule: >-
      Keep the only support packet, interface, EEG, labels, availability count,
      and impedance multiset fixed; rotate support impedance and availability
      together by one position over the eight canonical channels.
    eligible: at_least_two_query_support_comparable_channels
    no_future_query_or_other_participant_packet: true
    mandatory_use: N4_null_equivalence_structural_safety_guard_only
    positive_mechanism_or_efficacy_gate: false
  k3_pair_shuffle:
    rule: exhaustive_lexicographically_ordered_derangements_of_whole_support_packets_within_current_fit_prefix
    exact_derangement_counts: {3: 2, 5: 44}
    EEG_labels_and_packet_multiset_fixed: true
    support_reliability_w_b_stays_with_its_EEG_and_label_block: true
    evaluation_query_and_future_packets_forbidden: true
    mechanism_metric_reduction: >-
      Compute balanced accuracy and correct-label log score separately under
      every derangement, then average those metric values within participant;
      never count derangements as independent observations.
    averaged_probability_vector: diagnostic_artifact_only_not_the_mechanism_estimand
  potency:
    unit: participant_by_condition_by_query_block
    packet_binding_changed_fraction_under_derangements_must_equal: 1.0
    k1_channel_rotation_role: report_structural_changed_affinity_only_not_mandatory_pairing_potency
    diagnostic_k3_per_unit_nonzero_affinity_fraction: >-
      number of exhaustive derangements with abs(g_M_correct-g_M_deranged)
      greater than 1e-12 divided by the exact derangement count
