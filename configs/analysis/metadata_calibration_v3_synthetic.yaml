waveform:
  dtype: float64
  sampling_rate_hz: 250
  duration_seconds: 2.0
  channels: 8
  class_frequency_hz: 8.0_plus_0.4_times_zero_based_class
  harmonic_amplitudes: {1: 1.0, 2: 0.35}
  spatial_signature: normalized_participant_by_class_standard_normal_vector
  class_phase: participant_by_class_uniform_minus_pi_to_pi
  block_phase_drift_radians_sd: 0.08
  channel_gain_distribution: lognormal_meanlog_0_sdlog_0.12
  noise:
    process: stationary_AR1_per_channel
    rho: 0.55
    initialization: epsilon_0_equals_sigma_times_z_0_div_sqrt_1_minus_rho_squared
    recurrence: epsilon_t_equals_rho_times_epsilon_t_minus_1_plus_sigma_times_z_t
  exact_signal_composition: >-
    block_channel_gain times target_harmonics plus state_specific_confuser_harmonics
    plus stationary_AR1_noise; every class in a block shares one acquisition packet
  filterbank_config: configs/baselines/fbcca_chen2015_m3_v2_explicit_weights.yaml
  filterbank_config_sha256: b8c1ce4477d980b40f359bc3dc97f3125313191d24401f29a7e2dc473d0d1380
  execution: stream_one_participant_at_a_time_without_persisting_full_family_tensors

operator_grid:
  operator: P3_blockwise_score_prototype_reliability_mixture_with_context_trust_at_fusion_only
  ideal_prototype_smoothing: 0.05
  prototype_prior_pseudocount: [1.0, 4.0, 16.0]
  lambda_max: [0.10, 0.20, 0.30]
  entropy_scaling: true
  target_local_gate:
    evaluator: M_free_A_Q_vs_A0_only
    decision_bitwise_shared_by: [A_Q, A_QM]
    metadata_may_change_gate_decision: false
    k1_global_enable: true
    k3_and_k5_rule: chronological_prequential_BA_and_correct_log_probability_contract_in_master
    failure: exact_A0_for_both_A_Q_and_A_QM
  support_reliability:
    block_score: mean_temperature_one_strict_FBCCA_probability_on_the_observed_label_over_the_12_class_balanced_support_trials
    forbidden_inputs: [fitted_P3, metadata, query_EEG, query_label, query_batch, row_identity]
    clipped_range: [1.0e-12, 1.0]
    relative_weight: pi_b_equals_w_b_divided_by_sum_available_w_b
    common_support_probability: sum_pi_b_times_blockwise_P3_probability
    used_bitwise_identically_by: [A_Q, A_QM]
    no_absolute_anchor_correctness_gate: true
    lambda_Q: lambda_max_times_k_over_k_plus_one_times_query_entropy_quality
    prequential_evaluation_uses_only_prior_fit_prefix_blocks: true
    uniform_block_weight_sensitivity_required: true
  metadata:
    primary_support_and_query_interface_relation: same_interface
    interface_role: select_source_covariate_only_frozen_per_channel_impedance_scale
    interface_alone_may_change_output: false
    raw_context_consumer: metadata_adapter_preflight_only
    metadata_adapter_preflight:
      input: raw_context_reference_and_pairing_keys_without_any_support_signal
      output: typed_ContextPreflightCapability
      malformed_or_query_OOD: exact_A0_before_support_EEG_or_label_access
    metadata_adapter_finalization:
      inputs: [typed_ContextPreflightCapability, MFreeSupportReliabilityCapability]
      output: typed_ContextTrustCapability
      forbidden_direct_inputs: [raw_EEG, support_labels, query_labels, class_scores, probabilities, raw_context]
    scientific_operator_input: typed_ContextTrustCapability_only
    scientific_operator_forbidden_raw_inputs: [interface, impedance, availability]
    per_query_support_block_distance: >-
      median over channels valid in both packets of absolute difference between
      source-reference-standardized query and support log1p impedance
    per_query_support_block_affinity: two_to_negative_clip_distance_0_16
    M_free_support_block_reliability: >-
      immutable strict-FBCCA mean observed-support-label probability w_b from
      the class-balanced complete support block; its normalized pi_b is also
      the common P3 mixture weight in A_Q and A_QM
    multi_support_g_M: >-
      reliability-weighted mean affinity over every support block, assigning
      exact affinity one to any block with no comparable channel so missing
      context is neutral; if all are missing return A_Q directly
    output_capability_must_bind:
      - candidate_id
      - active_grid_cell_id
      - exact_operator_instance_digest
      - current_query_key
      - ordered_support_block_keys
      - context_preflight_capability_sha256
      - support_reliability_capability_sha256
      - context_reference_receipt_sha256
      - raw_packet_pairing_sha256
    exact_neutral: zero_standardized_distance_direct_return_A_Q
    OOD_guard: >-
      current query only; more than half its valid channels with absolute
      source-standardized log1p impedance above 8 returns A0 before support access
    insertion_point: multiply_A_Q_final_support_residual_coefficient_exactly_once
    all_missing: direct_return_A_Q
    unknown_interface: pooled_channel_center_and_scale_pair_then_A_Q_if_no_valid_channel
    negative_or_nonfinite_impedance: mark_channel_missing_then_A_Q_if_none_valid
    malformed_schema_channel_count_or_pairing_digest: direct_return_A0_before_support_access
  forced_on_mode:
    allowed: [unit_tests, nonreserved_synthetic_development]
    forbidden: [future_scientific_lockbox_deployment, human_deployment]

context_reference:
  source: separately_keyed_covariate_only_packets
  root_seed: 20260910
  interface_categories: [neutral, wet, dry]
  packets_per_interface: 256
  channels: 8
  state_assignment: exact_128_minus_one_and_128_plus_one_then_keyed_permutation_per_interface
  canonical_channel_offset_log1p: 0p04_times_channel_index_minus_3p5
  packet_formulas:
    neutral: numpy_log1p_6_plus_0p65_times_state_plus_channel_offset_plus_normal_0_0p05
    wet: numpy_log1p_20_plus_0p20_times_state_plus_channel_offset_plus_normal_0_0p03
    dry: numpy_log1p_262_plus_0p80_times_state_plus_channel_offset_plus_normal_0_0p08
  positive_impedance_conversion: numpy_expm1_of_generated_log1p_value
  channel_missingness:
    probability: 0.05
    axis: interface_by_packet_by_channel
    keyed_component: impedance_measurement_noise
  independence: reference_packets_share_no_EEG_state_noise_or_outcome_key_with_evaluation_participants
  allowed_fields: [interface, impedance_kohm_by_channel, channel_availability]
  forbidden_fields: [EEG, class, support_label, query_label, prediction, performance]
  center: per_interface_per_channel_median_of_log1p_impedance
  scale: per_interface_per_channel_1p4826_times_MAD_of_log1p_impedance
  pooled_center: per_channel_median_over_all_available_raw_log1p_values_from_all_three_interfaces
  pooled_scale: per_channel_1p4826_times_MAD_about_pooled_center_over_the_same_raw_values
  minimum_observed_packets_per_interface_channel: 128
  robust_scale_floor: 0.05
  pooled_per_channel_fallback_minimum_count: 256
  fallback_order: [interface_channel_center_and_scale_pair, pooled_channel_center_and_scale_pair, channel_unavailable]
  unknown_interface_OOD_standardization: pooled_channel_center_and_scale_pair
  receipt_must_be_frozen_before_any_grid_metric: true

families:
  B1_participant_class_confusion:
    role: beneficial_A_Q
    target_amplitude: 1.0
    confuser_amplitude: 0.90
    confuser_class: class_plus_1_plus_participant_mod_3_mod_12
