[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-free-eeg"
version = "0.1.0"
description = "Calibration-free EEG decoding with acquisition-condition prompts and optional REVE backbone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "pyarrow>=14.0,<26",
  "h5py>=3.9,<4",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
  "einops>=0.7,<1",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
reve = ["transformers>=4.45,<5", "huggingface_hub>=0.25,<1"]
tracking = ["tensorboard>=2.14,<3", "wandb>=0.17,<1"]
openbci = ["brainflow>=5.12"]
dvc = ["dvc>=3.50"]
moabb = ["moabb>=1.1", "mne>=1.6,<2", "scikit-learn>=1.3,<2"]
dev = ["pytest>=7.4,<10", "ruff>=0.4,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-temp"
